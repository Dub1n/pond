name: deck-framing
units: mm
scale: 0.18
options:
  A:
    title: "Option A — 2 m walk, 0.5 m overhang"
    views:
      plan:
        title: "Option A plan — 2 m walkway with 0.5 m inward overhang"
        aria_label: "Plan view of Option A showing a 2 m walkway and 0.5 m inward overhang."
        scale: 0.18
        background: "#ffffff"
      section:
        title: "Option A section — 2 m backspan with 0.5 m cantilever"
        aria_label: "Section view of Option A showing the 2 m backspan and 0.5 m cantilever."
        scale: 0.18
        background: "#ffffff"
        plane:
          axis: y
          coordinate: 6000
    components:
      - type: rectangle
        id: deck_walkway
        size: [7000, 7000]
        origin: [0, 0]
        class: component-structure
        label: "Deck walkway (2.0 m backspan)"
        label_id: "DK"
        height: 28
        material: decking
        metadata:
          elevation: 370
        views: [plan]
        cutouts:
          - size: [3000, 3000]
            anchor:
              ref: self
              align: center
      - type: rectangle
        id: pond_water
        size: [3000, 3000]
        origin: [2000, 2000]
        class: component-water
        label: "Pond opening (3.0 m square)"
        label_id: "C"
        height: 900
        material: water
        metadata:
          elevation: -900
        views: [plan]
      - type: rectangle
        id: support_beam
        size: [3360, 3360]
        anchor:
          ref: pond_water
          align: center
          anchor_point: center
        cutouts:
          - size: [3000, 3000]
            anchor:
              ref: self
              align: center
        class: component-beam
        label: "Support beam at pond edge"
        label_id: "S"
        height: 220
        material: timber
        metadata:
          elevation: 0
        views: [plan]
        views: [plan, section]
      - type: rectangle
        id: deck_overhang
        size: [3000, 3000]
        anchor:
          ref: pond_water
          align: center
          anchor_point: center
        class: component
        label: "Cantilevered deck (0.5 m overhang)"
        label_id: "CL"
        height: 28
        material: decking
        metadata:
          elevation: 370
        views: [plan, section]
        cutouts:
          - size: [2000, 2000]
            anchor:
              ref: self
              align: center
      - type: rectangle
        id: joists_west
        size: [2000, 140]
        anchor:
          ref: pond_water
          align: north_west
          anchor_point: north_east
          offset: [0, 430]
        repeat:
          count: 6
          spacing: [0, 400]
        class: component-outline
        label: "47×150 mm joist @ 400 mm centres"
        label_id: "E"
        height: 150
        material: joist
        metadata:
          elevation: 220
        views: [plan]
      - type: rectangle
        id: joists_east
        size: [2000, 140]
        anchor:
          ref: pond_water
          align: north_east
          anchor_point: north_west
          offset: [0, 430]
        repeat:
          count: 6
          spacing: [0, 400]
        class: component-outline
        label: "47×150 mm joist @ 400 mm centres"
        label_id: "E"
        height: 150
        material: joist
        metadata:
          elevation: 220
        views: [plan]
      - type: rectangle
        id: joists_south
        size: [140, 2000]
        anchor:
          ref: pond_water
          align: south_west
          anchor_point: north_west
          offset: [-430, 0]
        repeat:
          count: 6
          spacing: [400, 0]
        class: component-outline
        label: "47×150 mm joist @ 400 mm centres"
        label_id: "E"
        height: 150
        material: joist
        metadata:
          elevation: 220
        views: [plan]

