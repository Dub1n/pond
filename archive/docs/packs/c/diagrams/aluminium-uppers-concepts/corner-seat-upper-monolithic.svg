  <text x="-177.49732293738182" y="285.9973229373818" class="note">Monolithic aluminium corner-seat upper — current interface candidate</text>
  <text x="-177.49732293738182" y="303.9973229373818" class="note">Black: 10 mm aluminium candidate profile; red: M8; blue: C2 M8; dashed green: provisional M6 survey targets</text>
  <text x="-177.49732293738182" y="321.9973229373818" class="note">Six M8 rail axes: 55, 125 and 195 mm on each rail leg.</text>
  <text x="-177.49732293738182" y="339.9973229373818" class="note">Separate C2 axes: (55,-140) and (-140,55); 75 mm direct paths to the neighbouring 55 mm axes.</text>
  <text x="-177.49732293738182" y="357.9973229373818" class="note">Four provisional M6 basket targets retain R20 lands; move only after the real basket survey.</text>
  <text x="-177.49732293738182" y="375.9973229373818" class="note">Retain the separate lower corner web and prove the complete perforated wet joint.</text>
</svg>
