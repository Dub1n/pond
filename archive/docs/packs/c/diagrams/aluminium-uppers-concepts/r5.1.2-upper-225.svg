  <text x="-157.49732293738182" y="183.49732293738182" class="note">R5.1.2 monolithic upper — 225 mm reinforced-base screen</text>
  <text x="-157.49732293738182" y="201.49732293738182" class="note">Black: 10 mm aluminium candidate profile; red: M8; blue: C2 M8; dashed green: provisional M6 survey targets</text>
  <text x="-157.49732293738182" y="219.49732293738182" class="note">Envelope 315 x 265 mm; 40 mm arms; 90 mm central rail region.</text>
  <text x="-157.49732293738182" y="237.49732293738182" class="note">Four M8 axes use two capture stations and the retained +/-28 mm transverse rows.</text>
  <text x="-157.49732293738182" y="255.49732293738182" class="note">M6 circles are survey targets, not drilling coordinates; locate on the real basket ribs.</text>
</svg>
