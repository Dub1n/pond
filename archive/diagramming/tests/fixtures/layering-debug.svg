<svg xmlns="http://www.w3.org/2000/svg" role="img" width="3096" height="3096" style="overflow:visible" preserveAspectRatio="xMidYMid meet" viewBox="-48 -48 3096 3096">
  <defs>
    <style>:root { color-scheme: light; }
            text { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.01em; fill: #1c1c1c; }
            .label { font-size: 16px; }
            .note { font-size: 14px; fill: #505050; }
            .dim-line { stroke: #222; stroke-width: 1.6; fill: none; vector-effect: non-scaling-stroke; }
            .dim-extension { stroke: #888; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
            .dim-text { font-size: 14px; fill: #222; }
            line, polyline, polygon, rect, path { vector-effect: non-scaling-stroke; }
.component {
  fill: #f6f7f9;
  stroke: #1f2933;
  stroke-width: 2;
  stroke-linejoin: round;
}

.component-water {
  fill: #cbe7ff;
  stroke: #1f2933;
  stroke-width: 1.6;
}

.component-structure {
  fill: #e3dac9;
  stroke: #1f2933;
  stroke-width: 1.6;
}

.component-beam {
  fill: #c49a6c;
  stroke: #1f2933;
  stroke-width: 1.8;
}

.component-outline {
  fill: none;
  stroke: #1f2933;
  stroke-width: 2.4;
}

.component-detail {
  fill: none;
  stroke: #2b8a3e;
  stroke-width: 2;
  stroke-dasharray: 8 6;
}

.legend {
  fill: #1f2933;
}

.legend-title {
  font-weight: 600;
}

.legend-key {
  font-weight: 600;
}

.feature-label {
  fill: #1f2933;
  font-weight: 600;
}

.component.material-decking,
.component-structure.material-decking,
.material-decking {
  fill: #d5c1a3;
  stroke: #5f4b32;
}

.component.material-timber,
.component-structure.material-timber,
.material-timber {
  fill: #c89a5b;
  stroke: #5b3b12;
}

.component.material-joist,
.component-structure.material-joist,
.material-joist {
  fill: #a98d68;
  stroke: #49341d;
}

.component.material-water,
.component-structure.material-water,
.material-water,
.component-water.material-water {
  fill: #9fd5ff;
  stroke: #1f2933;
}

.component.material-soil,
.component-structure.material-soil,
.material-soil {
  fill: #cbb38a;
  stroke: #4a3f2b;
}

.component.material-pad,
.component-structure.material-pad,
.material-pad {
  fill: #b7c2c9;
  stroke: #48525a;
}

.hidden-outline,
.component.hidden-outline,
.component-structure.hidden-outline,
.component-beam.hidden-outline,
.component-structure.material-joist.hidden-outline {
  stroke: #46505a;
  stroke-linecap: butt;
  stroke-linejoin: round;
  fill: none;
}
.component-detail { stroke-dasharray: 1 0.75; }
.dim-extension { stroke-dasharray: 0.5 0.5; }</style>
  </defs>
  <rect x="-48" y="-48" width="3096" height="3096" fill="#ffffff" />
  <g id="scene">
    <path d="M 500.0,500.0 L 500.0,2500.0 L 2500.0,2500.0 L 2500.0,500.0 L 500.0,500.0 Z" data-id="water" class="component-water material-water" fill-rule="evenodd" />
    <path d="M 0.0,0.0 L 3000.0,0.0 L 3000.0,3000.0 L 0.0,3000.0 L 0.0,0.0 Z M 500.0,500.0 L 2500.0,500.0 L 2500.0,2500.0 L 500.0,2500.0 L 500.0,500.0 Z" data-id="deck_ring" class="component-structure material-decking" fill-rule="evenodd" />
    <path d="M 0.0,0.0 L 3000.0,0.0 L 3000.0,3000.0 L 0.0,3000.0 L 0.0,0.0 Z" class="component-water material-water hidden-outline" fill="none" fill-rule="evenodd" data-id="water::hidden-outline" stroke="#46505a" stroke-width="3.0000" stroke-dasharray="1.1250 0.7500" stroke-linecap="butt" stroke-linejoin="round" />
