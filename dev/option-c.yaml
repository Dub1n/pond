schema: pond-relationship-final-sketch
info:
  option: C
  title: "Option C — compact relationship-first sketch"
  description: "Minimal text → unambiguous scene using the proposed axis-map relate shape and reference components."

dimensions:
  structure:
    deck_span: 5000
    pond_span: 3000
    backspan: 1000
    cantilever: 250
    cantilever_inner: 340
    joist_spacing: 400
    joist_width: 47
    joist_depth: 150
    beam_width: 47
    beam_height: 150
    corner_diagonal_length_outer: 1281.277488
    corner_diagonal_length_inner: 480.8326
    corner_tie_spacing: 500
    decking_overhang: 90
    J2_offset: -decking_overhang + ((pond_span - 2 * cantilever_inner) / 6)
  finishes:
    deck_thickness: 28
  site:
    water_depth: 900
    pad_size: 600
    pad_height: 50

components:
  # Reference components (geometry-less frames/planes)
  - id: origin
    kind: reference
    size: [0, 0, 0]

  - id: structure_level
    kind: reference
    size: [1, 1, 0]
    relate: { cz: { ref: origin } }

  - id: deck_frame
    kind: reference
    size: [deck_span, deck_span, 0]

  - id: pond_frame
    kind: reference
    size: [pond_span, pond_span, 0]

  - id: opening_frame
    kind: reference
    size:
      - pond_span - 2 * cantilever_inner
      - pond_span - 2 * cantilever_inner
      - 0
    relate:
      cxcy: { ref: pond_frame }  # tie to pond_frame center; size + relate both define X/Y

  - id: water_surface
    kind: reference
    size: [1, 1, 0]
    relate: { cz: { ref: structure_level, offset: -pad_height } } # only Z matters; X/Y default to origin for references

  - id: water_bottom
    kind: reference
    size: [1, 1, 0]
    relate:
      cz: { ref: water_surface, offset: -water_depth }

  - id: pad_top
    kind: reference
    size: [1, 1, 0]
    relate: { cz: { ref: structure_level } }

  - id: joist_top
    kind: reference
    size: [1, 1, 0]
    relate: { cz: { ref: structure_level, offset: joist_depth } }

  - id: deck_surface_plane
    kind: reference
    size: [1, 1, 0]
    relate: { cz: { ref: joist_top, offset: deck_thickness } }

  - id: soil_frame
    kind: reference
    size: [deck_span + pad_size, deck_span + pad_size, 0]
    relate: { cxcy: { ref: origin } }

  # Components
  - id: pond_water
    class: IfcBuildingElementProxy
    size: [pond_span, pond_span, water_depth]
    material: water
    label: "3x3x0.9m Pond water"
    label_id: "W"
    # Relate anchors all three axes; no implicit centering needed
    relate:
      +x+y-x-y: { ref: pond_frame, pos: +x+y-x-y }  # symmetric faces bound together
      +z:   { ref: water_surface, pos: +z }
      -z:   { ref: water_bottom, pos: +z }
    ifc: { predefined_type: ELEMENT }

  - id: pond_opening
    class: IfcOpeningElement
    size:
      - pond_span - 2 * (cantilever_inner)
      - pond_span - 2 * (cantilever_inner)
      - deck_thickness
    # Size repeats the relate span; if they ever diverge lint should flag it
    relate:
      +x-x+y-y:
        ref: pond_frame
        pos: +x-x+y-y
        offset:
          +x+y: -(cantilever_inner)
          -x-y: (cantilever_inner)
      +z: { ref: deck_surface_plane }
      -z: { ref: joist_top, pos: +z }
    metadata:
      views: [section]
    ifc: { predefined_type: OPENING}

  - id: deck_surface
    class: IfcSlab
    size: [deck_span, deck_span, deck_thickness]
    material: decking
    label: "21x145mm (+4.5mm gap) Decking | 5, 4.7, 4.4, 4.1, 3.8, 3.5, 3.2, 2.9, 2.6"
    label_id: "D"
    # Size repeats the X/Y defined by relate; lint can catch drift if they ever differ
    relate:
      +x+y-x-y: { ref: deck_frame }
      -z:   { ref: joist_top, pos: +z }
      +z:   { ref: deck_surface_plane }
    voids:
      - ref: pond_opening
    ifc: { predefined_type: FLOOR}

  - id: outer_beam_west
    class: IfcBeam
    size: [beam_width, deck_span, beam_height]
    material: timber
    label: "47x150mm Outer perimeter beam | 5m"
    label_id: "O"
    # Axis-map relate replaces multiple align/contact clauses
    relate:
      -x+y-y: { ref: deck_frame }
      +z: { ref: joist_top }
      -z: { ref: pad_top, pos: +z }
    ifc: { predefined_type: BEAM }

  - id: inner_beam_west
    class: IfcBeam
    size: [beam_width, deck_span - beam_width * 2, beam_height]
    material: timber
    label: "47x150mm Inner beam | 3m"
    label_id: "I"
    # Axis-map relate sets X/Y/Z with one block
    relate:
      +x: { ref: pond_frame, pos: -x }
      -y+y: { ref: deck_frame, offset: { -y: beam_width, +y: -beam_width } }
      -z: { ref: pad_top, pos: +z }
      +z: { ref: joist_top }
    ifc: { predefined_type: BEAM }

  - id: joist_run_south_outer
    class: IfcBeam
    size:
      - joist_width
      - backspan + cantilever - beam_width
      - joist_depth
    material: timber
    label: "47x75mm Joist (outer) | backspan + 250mm cantilever"
    label_id: "J"
    array:
      -y: { ref: outer_beam_south, pos: +y }
      -x+x: { ref: opening_frame, offset: { -x: -decking_overhang, +x: decking_overhang } }
      +z: { ref: joist_top }
      repeat: { x: { count: 2 } }
    ifc: { predefined_type: JOIST }

  - id: joist_run_south_inner
    class: IfcBeam
    size:
      - joist_width
      - backspan + cantilever_inner - beam_width
      - joist_depth
    material: timber
    label: "47x75mm Joist (inner) | backspan + 340mm cantilever"
    label_id: "J"
    array:
      -y: { ref: outer_beam_south, pos: +y }
      -x+x: { ref: opening_frame, offset: { -x: J2_offset, +x: -J2_offset } }
      +z: { ref: joist_top, pos: +z }
      repeat: { x: { count: 5 } }
    ifc: { predefined_type: JOIST }

  - id: corner_diagonal_deck_to_inner_sw
    class: IfcBeam
    size: [corner_diagonal_length_outer, joist_width, joist_depth]
    material: joist
    label: "47x75mm Joist from deck corner to inner beam corner | 1414mm"
    label_id: "C1"
    relate:
      -xcy:
        - { ref: outer_beam_west, pos: +x }
        - { ref: outer_beam_south, pos: +y }
      +xcy:
        - { ref: inner_beam_west, pos: -x }
        - { ref: inner_beam_south, pos: -y }
      +z: { ref: joist_top }
    ifc: { predefined_type: JOIST }

  - id: corner_diagonal_inner_to_opening_sw
    class: IfcBeam
    size: [corner_diagonal_length_inner, joist_width, joist_depth]
    material: joist
    label: "47x75mm Joist from inner beam corner to pond opening corner | 481mm"
    label_id: "C2"
    relate:
      -xcy:
        - { ref: inner_beam_west, pos: +x }
        - { ref: inner_beam_south, pos: +y }
      +xcy:
        - { ref: opening_frame, pos: -x }
        - { ref: opening_frame, pos: -y }
      +z: { ref: joist_top, pos: +z }
    ifc: { predefined_type: JOIST }

  - id: corner_tie_horizontal_nw
    class: IfcBeam
    size: [corner_tie_spacing, joist_width, joist_depth]
    material: joist
    label: "47x75mm Corner tie to diagonal | 533mm"
    label_id: "T"
    relate:
      -x: { ref: outer_beam_west, pos: +x }
      +y: { ref: deck_frame, pos: +y, offset: -corner_tie_spacing + joist_width / 2 }
      +z: { ref: joist_top }
    ifc: { predefined_type: JOIST }

  - id: corner_tie_vertical_nw
    class: IfcBeam
    size: [joist_width, corner_tie_spacing, joist_depth]
    material: joist
    label: "47x75mm Corner tie to diagonal"
    label_id: "T"
    relate:
      -x: { ref: deck_frame, pos: -x, offset: corner_tie_spacing - joist_width / 2 }
      +y: { ref: outer_beam_north, pos: -y }
      +z: { ref: joist_top }
    ifc: { predefined_type: JOIST }

  - id: overhang_tip_nw
    kind: reference
    size: [0, 0, 0]
    relate:
      -x+y: { ref: opening_frame, offset: { -x: -cantilever_inner, +y: cantilever_inner } }
      +z: { ref: joist_top }

  - id: corner_diagonal_inner_span_check_nw
    kind: reference
    size: [cantilever_inner, 0, 0]
    relate:
      +x: { ref: opening_frame, pos: -x }
      -x: { ref: overhang_tip_nw, pos: -x }
      cy: { ref: opening_frame, pos: +y }

  - id: soil_fill
    class: IfcSlab
    size: [deck_span + pad_size, deck_span + pad_size, water_depth]
    material: soil
    label: "Soil fill"
    views: [section]
    relate:
      +x+y-x-y: { ref: soil_frame }
      -z+z: { ref: pond_water }
    ifc: { predefined_type: FLOOR}

  - id: pad_corner_nw
    class: IfcFooting
    size: [pad_size, pad_size, pad_height]
    material: pad
    label: "600x600x50mm Shallow pad foundation"
    label_id: "P"
    relate:
      +x: { ref: pond_frame, pos: -x }
      -y: { ref: pond_frame, pos: +y }
      +z: { ref: pad_top, pos: +z }
    ifc: { predefined_type: PAD_FOOTING }

  - id: pad_edge_center_west
    class: IfcFooting
    size: [pad_size, pad_size, pad_height]
    material: pad
    label: "600x600x50mm Shallow pad foundation"
    relate:
      +x: { ref: inner_beam_west, pos: +x }
      cy: { ref: pond_frame }
      +z: { ref: pad_top, pos: +z }
    label_id: "P"
    ifc: { predefined_type: PAD_FOOTING }

  - id: pad_outer_corner_nw
    class: IfcFooting
    size: [pad_size, pad_size, pad_height]
    material: pad
    label: "600x600x50mm Shallow pad foundation"
    label_id: "P"
    relate:
      cx: { ref: deck_frame, pos: -x, offset: beam_width / 2 }
      cy: { ref: deck_frame, pos: +y, offset: -beam_width / 2 }
      +z: { ref: pad_top, pos: +z }
    ifc: { predefined_type: PAD_FOOTING }


  - id: pad_run2_west
    class: IfcFooting
    size: [pad_size, pad_size, pad_height]
    material: pad
    label: "600x600x50mm Shallow pad foundation"
    label_id: "P"
    relate:
      cx: { ref: deck_frame, pos: -x, offset: beam_width / 2 }
      cy: { ref: joist_run_west_inner }
      +z: { ref: pad_top, pos: +z }
    ifc: { predefined_type: PAD_FOOTING }

  - id: pad_run6_west
    class: IfcFooting
    size: [pad_size, pad_size, pad_height]
    material: pad
    label: "600x600x50mm Shallow pad foundation"
    label_id: "P"
    relate:
      cx: { ref: deck_frame, pos: -x, offset: beam_width / 2 }
      cy: { ref: joist_run_west_inner#4 }
      +z: { ref: pad_top, pos: +z }
    ifc: { predefined_type: PAD_FOOTING }

  - id: joist_span_check_west
    kind: reference
    size: [null, 0, 0]
    relate:
      -x: { ref: joist_run_west_inner, pos: -x }
      +x: { ref: opening_frame, pos: -x }

operations:
  - type: rotate
    targets:
      - outer_beam_west
      - inner_beam_west
      - joist_run_south_outer
      - joist_run_south_inner
      - pad_corner_nw
      - pad_edge_center_west
      - pad_outer_corner_nw
      - pad_run2_west
      - pad_run6_west
      - corner_diagonal_deck_to_inner_sw
      - overhang_tip_nw
      - corner_diagonal_inner_to_opening_sw
      - corner_diagonal_inner_span_check_sw
      - corner_tie_horizontal_nw
      - corner_tie_vertical_nw
    about: { ref: origin, axis: +z }
    count: 4
    include_seed: true
    id_map:
      outer_beam_west: [outer_beam_west, outer_beam_south, outer_beam_east, outer_beam_north]
      inner_beam_west: [inner_beam_west, inner_beam_south, inner_beam_east, inner_beam_north]
      joist_run_south_outer: [joist_run_south_outer, joist_run_east_outer, joist_run_north_outer, joist_run_west_outer]
      joist_run_south_inner: [joist_run_south_inner, joist_run_east_inner, joist_run_north_inner, joist_run_west_inner]
      pad_corner_nw: [pad_corner_nw, pad_corner_sw, pad_corner_se, pad_corner_ne]
      pad_edge_center_west: [pad_edge_center_west, pad_edge_center_south, pad_edge_center_east, pad_edge_center_north]
      pad_outer_corner_nw: [pad_outer_corner_nw, pad_outer_corner_sw, pad_outer_corner_se, pad_outer_corner_ne]
      pad_run2_west: [pad_run2_west, pad_run2_south, pad_run2_east, pad_run2_north]
      pad_run6_west: [pad_run6_west, pad_run6_south, pad_run6_east, pad_run6_north]
      corner_diagonal_deck_to_inner_nw: [corner_diagonal_deck_to_inner_nw, corner_diagonal_sw_deck_to_inner, corner_diagonal_se_deck_to_inner, corner_diagonal_ne_deck_to_inner]
      overhang_tip_nw: [overhang_tip_nw, overhang_tip_sw, overhang_tip_se, overhang_tip_ne]
      corner_diagonal_inner_to_opening_sw: [corner_diagonal_inner_to_opening_sw, corner_diagonal_inner_to_opening_se, corner_diagonal_inner_to_opening_ne, corner_diagonal_inner_to_opening_nw]
      corner_diagonal_inner_span_check_sw: [corner_diagonal_inner_span_check_sw, corner_diagonal_inner_span_check_se, corner_diagonal_inner_span_check_ne, corner_diagonal_inner_span_check_nw]
      corner_tie_horizontal_nw: [corner_tie_horizontal_nw, corner_tie_horizontal_sw, corner_tie_horizontal_se, corner_tie_horizontal_ne]
      corner_tie_vertical_nw: [corner_tie_vertical_nw, corner_tie_vertical_sw, corner_tie_vertical_se, corner_tie_vertical_ne]

  - type: boolean
    target: soil_fill
    subtract:
      - pond_water
      - pad_corner_nw
      - pad_edge_center_west
      - pad_outer_corner_nw
      - pad_run2_west
      - pad_run6_west

views:
  plan:
    title: "Plan — compact relationship schema sketch"
    scale_hint: 0.18
    renders: [svg, png]
  section:
    title: "Section — compact relationship schema sketch"
    plane:
      axis: y
      coordinate: pond_span / 2
