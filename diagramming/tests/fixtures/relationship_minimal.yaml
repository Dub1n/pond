schema: pond-relationship-test
info:
  option: X
  title: "Relationship minimal test"
components:
  - id: origin
    kind: reference
    size: [0, 0, 0]
  - id: frame
    kind: reference
    size: [2000, 2000, 0]
    relate:
      cxcy: { ref: origin }
      cz: { ref: origin }
  - id: slab
    class: IfcSlab
    size: [2000, 2000, 28]
    material: decking
    relate:
      +x+y-x-y: { ref: frame, pos: +x+y-x-y }
      +z: { ref: origin }
      -z: { ref: origin, offset: -28 }
    ifc:
      predefined_type: FLOOR
views:
  plan:
    title: "Plan"
    renders: [svg]
  section:
    title: "Section"
    plane:
      axis: y
      coordinate: 0
