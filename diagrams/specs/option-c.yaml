schema: pond-relationship-final-sketch
info:
  option: C
  title: "Option C — compact relationship-first sketch"
  description: "Minimal text → unambiguous scene using the proposed axis-map relate shape and reference components."

dimensions:
  structure:
    pad_top_z: 0
    deck_span: 5000
    pond_span: 3000
    backspan: 1000
    cantilever: 350
    joist_spacing: 400
    joist_width: 47
    joist_depth: 75
    beam_width: 47
    beam_height: 150
    opening_width: pond_span - 2 * cantilever
    corner_diagonal_length_outer: 1281.277488
    corner_diagonal_length_inner: 494.974747
    corner_tie_spacing: 500
    corner_tie_length: 453
    joist_outer_low_center: 1273.5
    joist_inner_low_center: 1660.166667
    joist_inner_mid_low_center: 2080.083333
    joist_pair_clear_gap: 170
    joist_pair_offset: joist_pair_clear_gap / 2 + joist_width / 2
    joist_pair_low_center: deck_span / 2 - joist_pair_offset
    joist_pair_high_center: deck_span / 2 + joist_pair_offset
    joist_inner_mid_high_center: deck_span - joist_inner_mid_low_center
    joist_inner_high_center: deck_span - joist_inner_low_center
    joist_outer_high_center: deck_span - joist_outer_low_center
  finishes:
    deck_thickness: 28
  site:
    water_depth: 900
    pad_size: 600
    pad_height: 50

components:
  # Reference components (geometry-less frames/planes)
  - { id: origin, kind: reference, size: [0, 0, 0] }
  - { id: deck_frame, kind: reference, size: [deck_span, deck_span, 0] }
  - { id: pond_frame, kind: reference, size: [pond_span, pond_span, 0] }
  - { id: opening_frame, kind: reference, size: [opening_width, opening_width, 0] }
  
  # Components
  - id: pond_water
    class: IfcBuildingElementProxy
    size: [pond_span, pond_span, water_depth]
    material: water
    label: "3x3x0.9m Pond water"
    label_id: "W"
    relate:
      +x+y-x-y: { ref: pond_frame }
      +z:   { ref: origin, offset: -pad_height }
      -z:   { ref: origin, offset: -pad_height - water_depth }
    ifc: { predefined_type: ELEMENT }

  - id: pond_opening
    class: IfcOpeningElement
    size: [opening_width, opening_width, deck_thickness]
    relate:
      cxcy: [0, 0]
      -z: beam_height
    metadata:
      views: [section]
    ifc: { predefined_type: OPENING}

  - id: deck_surface
    class: IfcSlab
    size: [deck_span, deck_span, deck_thickness]
    material: decking
    label: "21x145mm (+4.5mm gap) Decking | 5, 4.7, 4.4, 4.1, 3.8, 3.5, 3.2, 2.9, 2.6"
    label_id: "D"
    relate:
      cxcy: [0, 0]
      -z: beam_height
    voids:
      - ref: pond_opening
    ifc: { predefined_type: FLOOR}

  - id: outer_beam_west
    class: IfcBeam
    size: [beam_width, deck_span, beam_height]
    material: timber
    label: "47x150mm Outer perimeter beam | 5m"
    label_id: "O"
    relate:
      -x+y-y: { ref: deck_frame }
      +z: { ref: deck_surface, pos: -z }
    ifc: { predefined_type: BEAM }

  - id: inner_beam_west
    class: IfcBeam
    size: [beam_width, deck_span - beam_width * 2, beam_height]
    material: timber
    label: "47x150mm Inner beam | 3m"
    label_id: "I"
    relate:
      +x: { ref: pond_frame, pos: -x }
      -y+y: { ref: deck_frame, offset: { -y: beam_width, +y: -beam_width } }
      +z: { ref: deck_surface, pos: -z }
    ifc: { predefined_type: BEAM }

  - id: joist_run_south
    class: IfcBeam
    size: [joist_width, backspan + cantilever - beam_width, joist_depth]
    material: timber
    label: "47x75mm Joist | 953mm backspan + 350mm overhang"
    label_id: "J"
    place:
      - id: joist_run_south_1
        cx: { ref: deck_frame, pos: -x, offset: joist_outer_low_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_2
        cx: { ref: deck_frame, pos: -x, offset: joist_inner_low_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_3
        cx: { ref: deck_frame, pos: -x, offset: joist_inner_mid_low_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_4
        cx: { ref: deck_frame, pos: -x, offset: joist_pair_low_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_5
        cx: { ref: deck_frame, pos: -x, offset: joist_pair_high_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_6
        cx: { ref: deck_frame, pos: -x, offset: joist_inner_mid_high_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_7
        cx: { ref: deck_frame, pos: -x, offset: joist_inner_high_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_8
        cx: { ref: deck_frame, pos: -x, offset: joist_outer_high_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
    ifc: { predefined_type: JOIST }

  - id: corner_diagonal_deck_to_inner_sw
    class: IfcBeam
    size: [corner_diagonal_length_outer, joist_width, joist_depth]
    material: joist
    label: "47x75mm Joist from deck corner to inner beam corner | 1281mm"
    label_id: "C1"
    relate:
      -xcy:
        - { ref: outer_beam_west, pos: +x }
        - { ref: outer_beam_south, pos: +y }
      +xcy:
        - { ref: inner_beam_west, pos: -x }
        - { ref: inner_beam_south, pos: -y }
      +z: { ref: deck_surface, pos: -z }
    ifc: { predefined_type: JOIST }

  - id: corner_diagonal_inner_to_opening_sw
    class: IfcBeam
    size: [corner_diagonal_length_inner, joist_width, joist_depth]
    material: joist
    label: "47x75mm Joist from inner beam corner to pond opening corner | 495mm"
    label_id: "C2"
    relate:
      -xcy:
        - { ref: inner_beam_west, pos: +x }
        - { ref: inner_beam_south, pos: +y }
      +xcy:
        - { ref: opening_frame, pos: -x }
        - { ref: opening_frame, pos: -y }
      +z: { ref: deck_surface, pos: -z }
    ifc: { predefined_type: JOIST }

  - id: corner_tie_horizontal_nw
    class: IfcBeam
    size: [corner_tie_length, joist_width, joist_depth]
    material: joist
    label: "47x75mm Corner tie to diagonal | 453mm"
    label_id: "T"
    relate:
      -x: { ref: outer_beam_west, pos: +x }
      +y: { ref: deck_frame, offset: -corner_tie_spacing + joist_width / 2 }
      +z: { ref: deck_surface, pos: -z }
    ifc: { predefined_type: JOIST }

  - id: overhang_tip_nw
    kind: reference
    size: [0, 0, 0]
    relate:
      -x+y: { ref: opening_frame, offset: { -x: -cantilever, +y: cantilever } }
      +z: { ref: deck_surface, pos: -z }

  - id: corner_diagonal_inner_span_check_nw
    kind: reference
    size: [cantilever, 0, 0]
    relate:
      +x: { ref: opening_frame, pos: -x }
      -x: { ref: overhang_tip_nw, pos: -x }
      cy: { ref: opening_frame, pos: +y }

  - id: soil_fill
    class: IfcSlab
    size: [deck_span + pad_size, deck_span + pad_size, water_depth]
    material: soil
    views: [section]
    relate:
      cxcy: [0, 0]
      -z+z: { ref: pond_water }
    ifc: { predefined_type: FLOOR}

  - id: pad_west
    class: IfcFooting
    size: [pad_size, pad_size, pad_height]
    material: pad
    label: "600x600x50mm Shallow pad foundation"
    label_id: "P"
    place:
      - id: pad_corner_nw
        +x: { ref: pond_frame, pos: -x }
        -y: { ref: pond_frame, pos: +y }
        +z: pad_top_z
      - id: pad_edge_center_west
        +x: { ref: inner_beam_west }
        cy: { ref: pond_frame }
        +z: pad_top_z
      - id: pad_outer_corner_nw
        cx: { ref: deck_frame, pos: -x, offset: beam_width / 2 }
        cy: { ref: deck_frame, pos: +y, offset: -beam_width / 2 }
        +z: pad_top_z
      - id: pad_run2_west
        cx: { ref: deck_frame, pos: -x, offset: beam_width / 2 }
        cy: { ref: joist_run_west_2 }
        +z: pad_top_z
      - id: pad_run6_west
        cx: { ref: deck_frame, pos: -x, offset: beam_width / 2 }
        cy: { ref: joist_run_west_7 }
        +z: pad_top_z
    ifc: { predefined_type: PAD_FOOTING }

  - id: joist_span_check_west
    kind: reference
    size: [null, 0, 0]
    relate:
      -x: { ref: joist_run_west_2 }
      +x: { ref: opening_frame, pos: -x }

operations:
  - type: mirror
    targets:
      - corner_tie_horizontal_nw
    plane:
      axis: x
      coordinate: 0
    include_seed: true

  - type: rotate
    targets:
      - outer_beam_west
      - inner_beam_west
      - joist_run_south
      - pad_west
      - corner_diagonal_deck_to_inner_sw
      - corner_diagonal_inner_to_opening_sw
      - corner_tie_horizontal_nw
    about: { ref: origin, axis: +z }
    count: 4
    include_seed: true
    id_map:
      outer_beam_west: [outer_beam_west, outer_beam_south, outer_beam_east, outer_beam_north]
      inner_beam_west: [inner_beam_west, inner_beam_south, inner_beam_east, inner_beam_north]
      joist_run_south_1: [joist_run_south_1, joist_run_east_1, joist_run_north_1, joist_run_west_1]
      joist_run_south_2: [joist_run_south_2, joist_run_east_2, joist_run_north_2, joist_run_west_2]
      joist_run_south_3: [joist_run_south_3, joist_run_east_3, joist_run_north_3, joist_run_west_3]
      joist_run_south_4: [joist_run_south_4, joist_run_east_4, joist_run_north_4, joist_run_west_4]
      joist_run_south_5: [joist_run_south_5, joist_run_east_5, joist_run_north_5, joist_run_west_5]
      joist_run_south_6: [joist_run_south_6, joist_run_east_6, joist_run_north_6, joist_run_west_6]
      joist_run_south_7: [joist_run_south_7, joist_run_east_7, joist_run_north_7, joist_run_west_7]
      joist_run_south_8: [joist_run_south_8, joist_run_east_8, joist_run_north_8, joist_run_west_8]
      pad_corner_nw: [pad_corner_nw, pad_corner_sw, pad_corner_se, pad_corner_ne]
      pad_edge_center_west: [pad_edge_center_west, pad_edge_center_south, pad_edge_center_east, pad_edge_center_north]
      pad_outer_corner_nw: [pad_outer_corner_nw, pad_outer_corner_sw, pad_outer_corner_se, pad_outer_corner_ne]
      pad_run2_west: [pad_run2_west, pad_run2_south, pad_run2_east, pad_run2_north]
      pad_run6_west: [pad_run6_west, pad_run6_south, pad_run6_east, pad_run6_north]
      corner_diagonal_inner_to_opening_sw: [corner_diagonal_inner_to_opening_sw, corner_diagonal_inner_to_opening_se, corner_diagonal_inner_to_opening_ne, corner_diagonal_inner_to_opening_nw]
      corner_diagonal_deck_to_inner_sw: [corner_diagonal_deck_to_inner_sw, corner_diagonal_deck_to_inner_se, corner_diagonal_deck_to_inner_ne, corner_diagonal_deck_to_inner_nw]
      corner_tie_horizontal_nw: [corner_tie_horizontal_nw, corner_tie_vertical_sw, corner_tie_horizontal_se, corner_tie_vertical_ne]
      corner_tie_horizontal_nw_mirrored: [corner_tie_horizontal_ne, corner_tie_vertical_se, corner_tie_horizontal_sw, corner_tie_vertical_nw]

  - type: boolean
    target: soil_fill
    subtract:
      - pond_water
      - pad_west

views:
  plan:
    title: "Plan — compact relationship schema sketch"
    scale_hint: 0.18
    renders: [svg, png]
  section:
    title: "Section — compact relationship schema sketch"
    scale_hint: 0.3
    plane:
      axis: y
      coordinate: 820
