schema: pond-relationship-rail-decking
info:
  option: C
  title: "Design C — R5.1 rail and decking"
  description: "Complete Design C context plus R5.1 prototype rail layer; envelope geometry only."

dimensions:
  structure:
    pad_top_z: 0
    deck_span: 5000
    pond_span: 3000
    backspan: 1000
    cantilever: 350
    joist_spacing: 400
    joist_width: 47
    joist_depth: 75
    beam_width: 47
    beam_height: 150
    opening_width: pond_span - 2 * cantilever
    corner_diagonal_length_outer: 1281.277488
    corner_diagonal_length_inner: 494.974747
    corner_tie_spacing: 500
    corner_tie_length: 453
    joist_outer_low_center: 1273.5
    joist_inner_low_center: 1660.166667
    joist_inner_mid_low_center: 2080.083333
    joist_pair_clear_gap: 170
    joist_pair_offset: joist_pair_clear_gap / 2 + joist_width / 2
    joist_pair_low_center: deck_span / 2 - joist_pair_offset
    joist_pair_high_center: deck_span / 2 + joist_pair_offset
    joist_inner_mid_high_center: deck_span - joist_inner_mid_low_center
    joist_inner_high_center: deck_span - joist_inner_low_center
    joist_outer_high_center: deck_span - joist_outer_low_center
  finishes:
    deck_thickness: 28
  site:
    # Water surface is coplanar with pad tops and beam undersides (Z = 0).
    water_surface_z: pad_top_z
    render_water_surface_z: pad_top_z - 350
    water_depth: 900
    pad_size: 600
    pad_height: 50

components:
  # Reference components (geometry-less frames/planes)
  - { id: origin, kind: reference, size: [0, 0, 0] }
  - { id: deck_frame, kind: reference, size: [deck_span, deck_span, 0] }
  - { id: pond_frame, kind: reference, size: [pond_span, pond_span, 0] }
  - { id: opening_frame, kind: reference, size: [opening_width, opening_width, 0] }

  # Components
  - id: pond_water
    class: IfcBuildingElementProxy
    size: [pond_span, pond_span, water_depth]
    material: water
    label: "3x3x0.9m Pond water"
    label_id: "W"
    relate:
      +x+y-x-y: { ref: pond_frame }
      +z:   render_water_surface_z
      -z:   render_water_surface_z - water_depth
    ifc: { predefined_type: ELEMENT }

  - id: pond_opening
    class: IfcOpeningElement
    size: [opening_width, opening_width, deck_thickness]
    relate:
      cxcy: [0, 0]
      -z: beam_height
    metadata:
      views: [section]
    ifc: { predefined_type: OPENING}

  - id: deck_surface
    class: IfcSlab
    size: [deck_span, deck_span, deck_thickness]
    material: decking
    label: "21x145mm (+4.5mm gap) Decking | 5, 4.7, 4.4, 4.1, 3.8, 3.5, 3.2, 2.9, 2.6"
    label_id: "D"
    relate:
      cxcy: [0, 0]
      -z: beam_height
    voids:
      - ref: pond_opening
    ifc: { predefined_type: FLOOR}

  - id: outer_beam_west
    class: IfcBeam
    size: [beam_width, deck_span, beam_height]
    material: timber
    label: "47x150mm Outer perimeter beam | 5m"
    label_id: "O"
    relate:
      -x+y-y: { ref: deck_frame }
      +z: { ref: deck_surface, pos: -z }
    ifc: { predefined_type: BEAM }

  - id: inner_beam_west
    class: IfcBeam
    size: [beam_width, deck_span - beam_width * 2, beam_height]
    material: timber
    label: "47x150mm Inner beam | 3m"
    label_id: "I"
    relate:
      +x: { ref: pond_frame, pos: -x }
      -y+y: { ref: deck_frame, offset: { -y: beam_width, +y: -beam_width } }
      +z: { ref: deck_surface, pos: -z }
    ifc: { predefined_type: BEAM }

  - id: joist_run_south
    class: IfcBeam
    size: [joist_width, backspan + cantilever - beam_width, joist_depth]
    material: timber
    label: "47x75mm Joist | 953mm backspan + 350mm overhang"
    label_id: "J"
    place:
      - id: joist_run_south_1
        cx: { ref: deck_frame, pos: -x, offset: joist_outer_low_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_2
        cx: { ref: deck_frame, pos: -x, offset: joist_inner_low_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_3
        cx: { ref: deck_frame, pos: -x, offset: joist_inner_mid_low_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_4
        cx: { ref: deck_frame, pos: -x, offset: joist_pair_low_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_5
        cx: { ref: deck_frame, pos: -x, offset: joist_pair_high_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_6
        cx: { ref: deck_frame, pos: -x, offset: joist_inner_mid_high_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_7
        cx: { ref: deck_frame, pos: -x, offset: joist_inner_high_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
      - id: joist_run_south_8
        cx: { ref: deck_frame, pos: -x, offset: joist_outer_high_center }
        -y: { ref: outer_beam_south, pos: +y }
        +z: { ref: deck_surface, pos: -z }
    ifc: { predefined_type: JOIST }

  - id: corner_diagonal_deck_to_inner_sw
    class: IfcBeam
    size: [corner_diagonal_length_outer, joist_width, joist_depth]
    material: joist
    label: "47x75mm Joist from deck corner to inner beam corner | 1281mm"
    label_id: "C1"
    relate:
      -xcy:
        - { ref: outer_beam_west, pos: +x }
        - { ref: outer_beam_south, pos: +y }
      +xcy:
        - { ref: inner_beam_west, pos: -x }
        - { ref: inner_beam_south, pos: -y }
      +z: { ref: deck_surface, pos: -z }
    ifc: { predefined_type: JOIST }

  - id: corner_diagonal_inner_to_opening_sw
    class: IfcBeam
    size: [corner_diagonal_length_inner, joist_width, joist_depth]
    material: joist
    label: "47x75mm Joist from inner beam corner to pond opening corner | 495mm"
    label_id: "C2"
    relate:
      -xcy:
        - { ref: inner_beam_west, pos: +x }
        - { ref: inner_beam_south, pos: +y }
      +xcy:
        - { ref: opening_frame, pos: -x }
        - { ref: opening_frame, pos: -y }
      +z: { ref: deck_surface, pos: -z }
    ifc: { predefined_type: JOIST }

  - id: corner_tie_horizontal_nw
    class: IfcBeam
    size: [corner_tie_length, joist_width, joist_depth]
    material: joist
    label: "47x75mm Corner tie to diagonal | 453mm"
    label_id: "T"
    relate:
      -x: { ref: outer_beam_west, pos: +x }
      +y: { ref: deck_frame, offset: -corner_tie_spacing + joist_width / 2 }
      +z: { ref: deck_surface, pos: -z }
    ifc: { predefined_type: JOIST }

  - id: overhang_tip_nw
    kind: reference
    size: [0, 0, 0]
    relate:
      -x+y: { ref: opening_frame, offset: { -x: -cantilever, +y: cantilever } }
      +z: { ref: deck_surface, pos: -z }

  - id: corner_diagonal_inner_span_check_nw
    kind: reference
    size: [cantilever, 0, 0]
    relate:
      +x: { ref: opening_frame, pos: -x }
      -x: { ref: overhang_tip_nw, pos: -x }
      cy: { ref: opening_frame, pos: +y }

  - id: soil_fill
    class: IfcSlab
    size: [deck_span + pad_size, deck_span + pad_size, water_depth]
    material: soil
    views: [section]
    relate:
      cxcy: [0, 0]
      -z+z: { ref: pond_water }
    ifc: { predefined_type: FLOOR}

  - id: pad_west
    class: IfcFooting
    size: [pad_size, pad_size, pad_height]
    material: pad
    label: "600x600x50mm Shallow pad foundation"
    label_id: "P"
    place:
      - id: pad_corner_nw
        +x: { ref: pond_frame, pos: -x }
        -y: { ref: pond_frame, pos: +y }
        +z: pad_top_z
      - id: pad_edge_center_west
        +x: { ref: inner_beam_west }
        cy: { ref: pond_frame }
        +z: pad_top_z
      - id: pad_outer_corner_nw
        cx: { ref: deck_frame, pos: -x, offset: beam_width / 2 }
        cy: { ref: deck_frame, pos: +y, offset: -beam_width / 2 }
        +z: pad_top_z
      - id: pad_run2_west
        cx: { ref: deck_frame, pos: -x, offset: beam_width / 2 }
        cy: { ref: joist_run_west_2 }
        +z: pad_top_z
      - id: pad_run6_west
        cx: { ref: deck_frame, pos: -x, offset: beam_width / 2 }
        cy: { ref: joist_run_west_7 }
        +z: pad_top_z
    ifc: { predefined_type: PAD_FOOTING }

  - id: joist_span_check_west
    kind: reference
    size: [null, 0, 0]
    relate:
      -x: { ref: joist_run_west_2 }
      +x: { ref: opening_frame, pos: -x }


  # R5.1 layer. Z=0 remains physical water datum; only pond_water is lowered
  # for this render so it does not conceal the rail, seats or lower bridges.
  - id: r51_rail_south
    class: IfcBuildingElementProxy
    size: [2138, 38, 38]
    material: grp
    label: "38 x 38 x 5 mm GRP ring; mitred rail envelope"
    label_id: R
    views: [plan, section]
    relate: {cx: 0, cy: -1050, +z: -208}
    ifc: {predefined_type: ELEMENT}

  # 250 x 250 mm Hs: 50 mm arms on 200 mm centres, 200 x 90 mm centre.
  # NS seats are on north/south rails and EW seats use the rotated equivalent.
  - id: r51_h_ns_arms
    class: IfcBuildingElementProxy
    size: [50, 250, 8]
    material: grp
    views: [plan, section]
    place:
      - {id: ns_s1a, cx: -620, cy: -1050, +z: -200}
      - {id: ns_s1b, cx: -420, cy: -1050, +z: -200}
      - {id: ns_s2a, cx: -100, cy: -1050, +z: -200}
      - {id: ns_s2b, cx: 100, cy: -1050, +z: -200}
      - {id: ns_s3a, cx: 420, cy: -1050, +z: -200}
      - {id: ns_s3b, cx: 620, cy: -1050, +z: -200}
      - {id: ns_n1a, cx: -620, cy: 1050, +z: -200}
      - {id: ns_n1b, cx: -420, cy: 1050, +z: -200}
      - {id: ns_n2a, cx: -100, cy: 1050, +z: -200}
      - {id: ns_n2b, cx: 100, cy: 1050, +z: -200}
      - {id: ns_n3a, cx: 420, cy: 1050, +z: -200}
      - {id: ns_n3b, cx: 620, cy: 1050, +z: -200}
      - {id: ns_nwa, cx: -1150, cy: 1050, +z: -200}
      - {id: ns_nwb, cx: -950, cy: 1050, +z: -200}
      - {id: ns_nea, cx: 950, cy: 1050, +z: -200}
      - {id: ns_neb, cx: 1150, cy: 1050, +z: -200}
    ifc: {predefined_type: ELEMENT}
  - id: r51_h_ns_centres
    class: IfcBuildingElementProxy
    size: [200, 90, 8]
    material: grp
    views: [plan, section]
    place:
      - {id: ns_s1, cx: -520, cy: -1050, +z: -200}
      - {id: ns_s2, cx: 0, cy: -1050, +z: -200}
      - {id: ns_s3, cx: 520, cy: -1050, +z: -200}
      - {id: ns_n1, cx: -520, cy: 1050, +z: -200}
      - {id: ns_n2, cx: 0, cy: 1050, +z: -200}
      - {id: ns_n3, cx: 520, cy: 1050, +z: -200}
      - {id: ns_nw, cx: -1050, cy: 1050, +z: -200}
      - {id: ns_ne, cx: 1050, cy: 1050, +z: -200}
    ifc: {predefined_type: ELEMENT}
  - id: r51_h_ew_arms
    class: IfcBuildingElementProxy
    size: [250, 50, 8]
    material: grp
    views: [plan, section]
    place:
      - {id: ew_w1a, cx: -1050, cy: 460, +z: -200}
      - {id: ew_w1b, cx: -1050, cy: 660, +z: -200}
      - {id: ew_w2a, cx: -1050, cy: -660, +z: -200}
      - {id: ew_w2b, cx: -1050, cy: -460, +z: -200}
      - {id: ew_e1a, cx: 1050, cy: 460, +z: -200}
      - {id: ew_e1b, cx: 1050, cy: 660, +z: -200}
      - {id: ew_e2a, cx: 1050, cy: -660, +z: -200}
      - {id: ew_e2b, cx: 1050, cy: -460, +z: -200}
      - {id: ew_sea, cx: 1050, cy: -1150, +z: -200}
      - {id: ew_seb, cx: 1050, cy: -950, +z: -200}
    ifc: {predefined_type: ELEMENT}
  - id: r51_h_ew_centres
    class: IfcBuildingElementProxy
    size: [90, 200, 8]
    material: grp
    views: [plan, section]
    place:
      - {id: ew_w1, cx: -1050, cy: 560, +z: -200}
      - {id: ew_w2, cx: -1050, cy: -560, +z: -200}
      - {id: ew_e1, cx: 1050, cy: 560, +z: -200}
      - {id: ew_e2, cx: 1050, cy: -560, +z: -200}
      - {id: ew_se, cx: 1050, cy: -1050, +z: -200}
    ifc: {predefined_type: ELEMENT}

  # Every H has two lower bridges, POM sleeves and M8 capture hardware.
  # One shown block per capture station avoids fake drilled bores in the scene.
  - id: r51_capture_ns
    class: IfcBuildingElementProxy
    size: [50, 110, 47]
    material: basket-polymer
    views: [plan, section]
    place:
      - {id: cap_s1a, cx: -620, cy: -1050, cz: -227.5}
      - {id: cap_s1b, cx: -420, cy: -1050, cz: -227.5}
      - {id: cap_s2a, cx: -100, cy: -1050, cz: -227.5}
      - {id: cap_s2b, cx: 100, cy: -1050, cz: -227.5}
      - {id: cap_s3a, cx: 420, cy: -1050, cz: -227.5}
      - {id: cap_s3b, cx: 620, cy: -1050, cz: -227.5}
      - {id: cap_n1a, cx: -620, cy: 1050, cz: -227.5}
      - {id: cap_n1b, cx: -420, cy: 1050, cz: -227.5}
      - {id: cap_n2a, cx: -100, cy: 1050, cz: -227.5}
      - {id: cap_n2b, cx: 100, cy: 1050, cz: -227.5}
      - {id: cap_n3a, cx: 420, cy: 1050, cz: -227.5}
      - {id: cap_n3b, cx: 620, cy: 1050, cz: -227.5}
      - {id: cap_nwa, cx: -1150, cy: 1050, cz: -227.5}
      - {id: cap_nwb, cx: -950, cy: 1050, cz: -227.5}
      - {id: cap_nea, cx: 950, cy: 1050, cz: -227.5}
      - {id: cap_neb, cx: 1150, cy: 1050, cz: -227.5}
    ifc: {predefined_type: ELEMENT}
  - id: r51_capture_ew
    class: IfcBuildingElementProxy
    size: [110, 50, 47]
    material: basket-polymer
    views: [plan, section]
    place:
      - {id: cap_w1a, cx: -1050, cy: 460, cz: -227.5}
      - {id: cap_w1b, cx: -1050, cy: 660, cz: -227.5}
      - {id: cap_w2a, cx: -1050, cy: -660, cz: -227.5}
      - {id: cap_w2b, cx: -1050, cy: -460, cz: -227.5}
      - {id: cap_e1a, cx: 1050, cy: 460, cz: -227.5}
      - {id: cap_e1b, cx: 1050, cy: 660, cz: -227.5}
      - {id: cap_e2a, cx: 1050, cy: -660, cz: -227.5}
      - {id: cap_e2b, cx: 1050, cy: -460, cz: -227.5}
      - {id: cap_sea, cx: 1050, cy: -1150, cz: -227.5}
      - {id: cap_seb, cx: 1050, cy: -950, cz: -227.5}
    ifc: {predefined_type: ELEMENT}
  - id: r51_retention
    class: IfcBuildingElementProxy
    size: [40, 40, 6]
    material: a4-stainless
    views: [plan, section]
    place:
      - {id: ret_s1, cx: -520, cy: -1050, +z: -190}
      - {id: ret_s2, cx: 0, cy: -1050, +z: -190}
      - {id: ret_s3, cx: 520, cy: -1050, +z: -190}
      - {id: ret_n1, cx: -520, cy: 1050, +z: -190}
      - {id: ret_n2, cx: 0, cy: 1050, +z: -190}
      - {id: ret_n3, cx: 520, cy: 1050, +z: -190}
      - {id: ret_w1, cx: -1050, cy: 560, +z: -190}
      - {id: ret_w2, cx: -1050, cy: -560, +z: -190}
      - {id: ret_e1, cx: 1050, cy: 560, +z: -190}
      - {id: ret_e2, cx: 1050, cy: -560, +z: -190}
      - {id: ret_nw, cx: -1050, cy: 1050, +z: -190}
      - {id: ret_ne, cx: 1050, cy: 1050, +z: -190}
      - {id: ret_se, cx: 1050, cy: -1050, +z: -190}
    ifc: {predefined_type: ELEMENT}

  # Two 25 mm endless cam straps run through each H beside the capture stations.
  - id: r51_straps_ns
    class: IfcBuildingElementProxy
    size: [25, 8, 48]
    material: polyester
    views: [plan, section]
    place:
      - {id: strap_s1a, cx: -620, cy: -1010, cz: -227}
      - {id: strap_s1b, cx: -420, cy: -1010, cz: -227}
      - {id: strap_s2a, cx: -100, cy: -1010, cz: -227}
      - {id: strap_s2b, cx: 100, cy: -1010, cz: -227}
      - {id: strap_s3a, cx: 420, cy: -1010, cz: -227}
      - {id: strap_s3b, cx: 620, cy: -1010, cz: -227}
      - {id: strap_n1a, cx: -620, cy: 1010, cz: -227}
      - {id: strap_n1b, cx: -420, cy: 1010, cz: -227}
      - {id: strap_n2a, cx: -100, cy: 1010, cz: -227}
      - {id: strap_n2b, cx: 100, cy: 1010, cz: -227}
      - {id: strap_n3a, cx: 420, cy: 1010, cz: -227}
      - {id: strap_n3b, cx: 620, cy: 1010, cz: -227}
      - {id: strap_nwa, cx: -1150, cy: 1010, cz: -227}
      - {id: strap_nwb, cx: -950, cy: 1010, cz: -227}
      - {id: strap_nea, cx: 950, cy: 1010, cz: -227}
      - {id: strap_neb, cx: 1150, cy: 1010, cz: -227}
    ifc: {predefined_type: ELEMENT}
  - id: r51_straps_ew
    class: IfcBuildingElementProxy
    size: [8, 25, 48]
    material: polyester
    views: [plan, section]
    place:
      - {id: strap_w1a, cx: -1010, cy: 460, cz: -227}
      - {id: strap_w1b, cx: -1010, cy: 660, cz: -227}
      - {id: strap_w2a, cx: -1010, cy: -660, cz: -227}
      - {id: strap_w2b, cx: -1010, cy: -460, cz: -227}
      - {id: strap_e1a, cx: 1010, cy: 460, cz: -227}
      - {id: strap_e1b, cx: 1010, cy: 660, cz: -227}
      - {id: strap_e2a, cx: 1010, cy: -660, cz: -227}
      - {id: strap_e2b, cx: 1010, cy: -460, cz: -227}
      - {id: strap_sea, cx: 1010, cy: -1150, cz: -227}
      - {id: strap_seb, cx: 1010, cy: -950, cz: -227}
    ifc: {predefined_type: ELEMENT}

  - id: r51_corner_web_sw
    class: IfcBuildingElementProxy
    size: [260, 260, 19]
    material: grp
    label: "Paired 9.5 mm compact corner webs; inner and outer diagonal trims shown"
    label_id: C
    views: [plan, section]
    # Local compact-web bounds are X/Y = -40..220 from the rail-centre
    # intersection. Its 260 mm blank therefore centres at (-960, -960).
    relate: {cx: -960, cy: -960, cz: -208}
    ifc: {predefined_type: ELEMENT}
  # Rotated rectangular half-plane cutters form the exact diagonal edges of
  # the documented six-vertex polygon. They are explicit at each corner
  # because relate.orient must not be overwritten by a clone operation.
  - id: r51_corner_web_inner_cut_sw
    class: IfcOpeningElement
    size: [400, 200, 21]
    relate: {cx: -1120.710678, cy: -1120.710678, cz: -208, orient: {axis: +x, vector: [1, -1, 0]}}
    ifc: {predefined_type: OPENING}
  - id: r51_corner_web_outer_cut_sw
    class: IfcOpeningElement
    size: [400, 200, 21]
    relate: {cx: -849.289322, cy: -849.289322, cz: -208, orient: {axis: +x, vector: [1, -1, 0]}}
    ifc: {predefined_type: OPENING}
  - id: r51_corner_web_inner_cut_se
    class: IfcOpeningElement
    size: [400, 200, 21]
    relate: {cx: 1120.710678, cy: -1120.710678, cz: -208, orient: {axis: +x, vector: [1, 1, 0]}}
    ifc: {predefined_type: OPENING}
  - id: r51_corner_web_outer_cut_se
    class: IfcOpeningElement
    size: [400, 200, 21]
    relate: {cx: 849.289322, cy: -849.289322, cz: -208, orient: {axis: +x, vector: [1, 1, 0]}}
    ifc: {predefined_type: OPENING}
  - id: r51_corner_web_inner_cut_ne
    class: IfcOpeningElement
    size: [400, 200, 21]
    relate: {cx: 1120.710678, cy: 1120.710678, cz: -208, orient: {axis: +x, vector: [-1, 1, 0]}}
    ifc: {predefined_type: OPENING}
  - id: r51_corner_web_outer_cut_ne
