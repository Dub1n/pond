# R3 Spine — editable comparison model, millimetres.
# Read docs/packs/c/R3-rail.md and README.md in this directory.
# Same origin/orientation as option-c.yaml: pond centre X/Y=0, water/pad tops Z=0.
# CONTEXT components are removable when combining with Option C; reuse its datums/joists.
# One B28 station only. Basket base is assumed; no final planting layout is implied.
# Hollow GRP, cord wraps and hardware are envelope solids, not manufacturing bores.
# Use --collision-mode ignore for declared envelope overlaps; audit with warn first.
# Sloping cord lengths below are explicit because expressions have no sqrt().
# If changing water/rail/joist dimensions, recompute these lengths from the shown vectors.
# Ring corners and contact overlaps are documented in README.md; no hidden structural credit.
schema: pond-relationship-rail-study
info:
  option: R3
  title: "R3 — Spine"
  description: "Single-spine ring with one editable basket seat; see the Pack C design document."

dimensions:
  interface:
    pad_top_z: 0
    water_surface_z: pad_top_z
    deck_span: 5000
    pond_span: 3000
    cantilever: 350
    beam_height: 150
    joist_depth: 75
    joist_width: 47
    beam_width: 47
    backspan: 1000
    deck_thickness: 28
    opening_width: pond_span - 2 * cantilever
  rail:
    r3_line: pond_span / 2 - 450
    r3_rail_size: 38
    r3_bearing_depth: 200
    r3_seat_depth: 25
    r3_rail_top: water_surface_z - r3_bearing_depth - r3_seat_depth
    r3_basket_x: -260
    r3_basket_rim: 280
    r3_basket_base: 200
    r3_basket_height: 190
    r3_bar_length: r3_basket_base + 30
    r3_bar_spacing: r3_basket_base - 40
    r3_joist_1_x: -1226.5
    r3_joist_2_x: -839.833333
    r3_joist_3_x: -419.916667
    r3_joist_4_x: -108.5
    r3_joist_5_x: 108.5
    r3_joist_6_x: 419.916667
    r3_joist_7_x: 839.833333
    r3_joist_8_x: 1226.5

components:
  # CONTEXT: reuse the identically named Option C reference.
  - id: origin
    kind: reference
    size: [0, 0, 0]

  # CONTEXT: reuse the identically named Option C reference.
  - id: deck_frame
    kind: reference
    size: [deck_span, deck_span, 0]

  # CONTEXT: reuse the identically named Option C reference.
  - id: pond_frame
    kind: reference
    size: [pond_span, pond_span, 0]

  # CONTEXT: reuse the identically named Option C reference.
  - id: opening_frame
    kind: reference
    size: [opening_width, opening_width, 0]

  # CONTEXT: identical south joist IDs/positions to Option C; omit on integration.
  - id: joist_run_south
    class: IfcBuildingElementProxy
    size: [joist_width, backspan + cantilever - beam_width, joist_depth]
    material: timber
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    label: 'Context: as-built south joists; upper wraps need future access'
    label_id: J
    place:
      - id: joist_run_south_1
        cx: r3_joist_1_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_2
        cx: r3_joist_2_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_3
        cx: r3_joist_3_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_4
        cx: r3_joist_4_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_5
        cx: r3_joist_5_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_6
        cx: r3_joist_6_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_7
        cx: r3_joist_7_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_8
        cx: r3_joist_8_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height

  # CONTEXT display line only; delete on integration.
  - id: r3_water_line
    class: IfcBuildingElementProxy
    size: [600, 500, 1]
    material: water
    ifc: {predefined_type: ELEMENT}
    views: [section, suspension]
    label: Water datum Z=0 = pad tops / beam undersides (line only)
    label_id: W
    relate:
      cx: r3_basket_x
      cy: -r3_line
      cz: water_surface_z

  # CONTEXT display strip only; delete on integration.
  - id: r3_deck_edge
    class: IfcBuildingElementProxy
    size: [600, 1, deck_thickness]
    material: decking
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    label: Finished deck edge; 350 mm overhang (line only)
    label_id: D
    relate:
      cx: r3_basket_x
      cy: {pos: -y, ref: opening_frame}
      -z: beam_height

  # Square-ended envelope stands for the mitred south member. See R3 corner detail.
  - id: r3_rail_south
    class: IfcBuildingElementProxy
    size: [2 * r3_line + r3_rail_size, r3_rail_size, r3_rail_size]
    material: grp
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, connection, suspension]
    label: 38 x 38 x 5 GRP spine; solid envelope, mitres/vents noted
    label_id: R
    relate:
      cx: {pos: cx, ref: pond_frame}
      cy: {offset: 450, pos: -y, ref: pond_frame}
      +z: r3_rail_top

  # EDIT THIS STATION to move the entire basket and local support together.
  # South side: X along rail, +Y pondward. CZ is basket bearing surface.
  - id: r3_station
    kind: reference
    size: [0, 0, 0]
    relate:
      cx: r3_basket_x
      cy: {offset: 450, pos: -y, ref: pond_frame}
      cz: water_surface_z - r3_bearing_depth

  - id: r3_upper_3
    kind: reference
    size: [0, 0, 0]
    relate:
      cx: {pos: cx, ref: joist_run_south_3}
      cy: {offset: -50, pos: +y, ref: joist_run_south_3}
      cz: {offset: -3, pos: -z, ref: joist_run_south_3}

  - id: r3_joist_wrap_cross_3
    class: IfcBuildingElementProxy
    size: [53, 6, 6]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    label: '6 mm polyester support: two turns, chafe sleeves, backed knot; keeper omitted'
    label_id: C
    place:
      - id: r3_joist_wrap_bottom_3
        cx: {offset: 0, pos: cx, ref: r3_upper_3}
        cy: {offset: 0, pos: cy, ref: r3_upper_3}
        cz: {offset: 0, pos: cz, ref: r3_upper_3}
      - id: r3_joist_wrap_top_3
        cx: {offset: 0, pos: cx, ref: r3_upper_3}
        cy: {offset: 0, pos: cy, ref: r3_upper_3}
        cz: {offset: 81, pos: cz, ref: r3_upper_3}

  - id: r3_joist_wrap_sides_3
    class: IfcBuildingElementProxy
    size: [6, 6, 75]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    place:
      - id: r3_joist_wrap_left_3
        cx: {offset: -26.5, pos: cx, ref: r3_upper_3}
        cy: {offset: 0, pos: cy, ref: r3_upper_3}
        cz: {offset: 40.5, pos: cz, ref: r3_upper_3}
      - id: r3_joist_wrap_right_3
        cx: {offset: 26.5, pos: cx, ref: r3_upper_3}
        cy: {offset: 0, pos: cy, ref: r3_upper_3}
        cz: {offset: 40.5, pos: cz, ref: r3_upper_3}

  # Cord centreline vector (0, 128, rail_top - 91); length is its Euclidean norm.
  # End stations land at rail ends; other stations align with actual joist X.
  - id: r3_drop_3_1
    class: IfcBuildingElementProxy
    size: [340.939877, 6, 6]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    relate:
      cx: {offset: 0.0, pos: cx, ref: r3_upper_3}
      cy: {offset: 64.0, pos: cy, ref: r3_upper_3}
      cz: {offset: (r3_rail_top - 19 - (beam_height - joist_depth - 3)) / 2, pos: cz, ref: r3_upper_3}
      orient: {axis: +x, vector: [0.0, 128, r3_rail_top - 19 - (beam_height - joist_depth - 3)]}

  - id: r3_lower_3_1
    kind: reference
    size: [0, 0, 0]
    relate:
      cx: -419.916667
      cy: {pos: cy, ref: r3_rail_south}
      cz: {pos: cz, ref: r3_rail_south}

  - id: r3_lower_wrap_cross_3_1
    class: IfcBuildingElementProxy
    size: [6, 44, 6]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    place:
      - id: r3_lower_wrap_top_3_1
        cx: {offset: 0, pos: cx, ref: r3_lower_3_1}
        cy: {offset: 0, pos: cy, ref: r3_lower_3_1}
        cz: {offset: 22, pos: cz, ref: r3_lower_3_1}
      - id: r3_lower_wrap_bottom_3_1
        cx: {offset: 0, pos: cx, ref: r3_lower_3_1}
        cy: {offset: 0, pos: cy, ref: r3_lower_3_1}
        cz: {offset: -22, pos: cz, ref: r3_lower_3_1}

  # One envelope turn shown; use two actual turns and collars either side, per R3.
  - id: r3_lower_wrap_sides_3_1
    class: IfcBuildingElementProxy
    size: [6, 6, 38]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    place:
      - id: r3_lower_wrap_bank_3_1
        cx: {offset: 0, pos: cx, ref: r3_lower_3_1}
        cy: {offset: -22, pos: cy, ref: r3_lower_3_1}
        cz: {offset: 0, pos: cz, ref: r3_lower_3_1}
      - id: r3_lower_wrap_pond_3_1
        cx: {offset: 0, pos: cx, ref: r3_lower_3_1}
        cy: {offset: 22, pos: cy, ref: r3_lower_3_1}
        cz: {offset: 0, pos: cz, ref: r3_lower_3_1}

  - id: r3_upper_4
    kind: reference
    size: [0, 0, 0]
    relate:
      cx: {pos: cx, ref: joist_run_south_4}
      cy: {offset: -50, pos: +y, ref: joist_run_south_4}
      cz: {offset: -3, pos: -z, ref: joist_run_south_4}

  - id: r3_joist_wrap_cross_4
    class: IfcBuildingElementProxy
    size: [53, 6, 6]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    label: '6 mm polyester support: two turns, chafe sleeves, backed knot; keeper omitted'
    label_id: C
    place:
      - id: r3_joist_wrap_bottom_4
        cx: {offset: 0, pos: cx, ref: r3_upper_4}
        cy: {offset: 0, pos: cy, ref: r3_upper_4}
        cz: {offset: 0, pos: cz, ref: r3_upper_4}
      - id: r3_joist_wrap_top_4
        cx: {offset: 0, pos: cx, ref: r3_upper_4}
        cy: {offset: 0, pos: cy, ref: r3_upper_4}
        cz: {offset: 81, pos: cz, ref: r3_upper_4}

  - id: r3_joist_wrap_sides_4
    class: IfcBuildingElementProxy
    size: [6, 6, 75]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    place:
      - id: r3_joist_wrap_left_4
        cx: {offset: -26.5, pos: cx, ref: r3_upper_4}
        cy: {offset: 0, pos: cy, ref: r3_upper_4}
        cz: {offset: 40.5, pos: cz, ref: r3_upper_4}
      - id: r3_joist_wrap_right_4
        cx: {offset: 26.5, pos: cx, ref: r3_upper_4}
        cy: {offset: 0, pos: cy, ref: r3_upper_4}
        cz: {offset: 40.5, pos: cz, ref: r3_upper_4}

  # Cord centreline vector (0, 128, rail_top - 91); length is its Euclidean norm.
  # End stations land at rail ends; other stations align with actual joist X.
  - id: r3_drop_4_1
    class: IfcBuildingElementProxy
    size: [340.939877, 6, 6]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    relate:
      cx: {offset: 0.0, pos: cx, ref: r3_upper_4}
      cy: {offset: 64.0, pos: cy, ref: r3_upper_4}
      cz: {offset: (r3_rail_top - 19 - (beam_height - joist_depth - 3)) / 2, pos: cz, ref: r3_upper_4}
      orient: {axis: +x, vector: [0.0, 128, r3_rail_top - 19 - (beam_height - joist_depth - 3)]}

  - id: r3_lower_4_1
    kind: reference
    size: [0, 0, 0]
    relate:
      cx: -108.5
      cy: {pos: cy, ref: r3_rail_south}
      cz: {pos: cz, ref: r3_rail_south}

  - id: r3_lower_wrap_cross_4_1
    class: IfcBuildingElementProxy
    size: [6, 44, 6]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    place:
      - id: r3_lower_wrap_top_4_1
        cx: {offset: 0, pos: cx, ref: r3_lower_4_1}
        cy: {offset: 0, pos: cy, ref: r3_lower_4_1}
        cz: {offset: 22, pos: cz, ref: r3_lower_4_1}
      - id: r3_lower_wrap_bottom_4_1
        cx: {offset: 0, pos: cx, ref: r3_lower_4_1}
        cy: {offset: 0, pos: cy, ref: r3_lower_4_1}
        cz: {offset: -22, pos: cz, ref: r3_lower_4_1}

  # One envelope turn shown; use two actual turns and collars either side, per R3.
  - id: r3_lower_wrap_sides_4_1
    class: IfcBuildingElementProxy
    size: [6, 6, 38]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    place:
      - id: r3_lower_wrap_bank_4_1
        cx: {offset: 0, pos: cx, ref: r3_lower_4_1}
        cy: {offset: -22, pos: cy, ref: r3_lower_4_1}
        cz: {offset: 0, pos: cz, ref: r3_lower_4_1}
      - id: r3_lower_wrap_pond_4_1
        cx: {offset: 0, pos: cx, ref: r3_lower_4_1}
        cy: {offset: 22, pos: cy, ref: r3_lower_4_1}
        cz: {offset: 0, pos: cz, ref: r3_lower_4_1}

  - id: r3_basket_bars
    class: IfcBuildingElementProxy
    size: [25, r3_bar_length, 25]
    material: grp
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    label: Two 25 x 25 x 3 GRP bearing bars; base + 30 mm long
    label_id: S
    place:
      - id: r3_bar_left
        cx: {offset: -r3_bar_spacing / 2, pos: cx, ref: r3_station}
        cy: {offset: 0, pos: cy, ref: r3_station}
        cz: {offset: -12.5, pos: cz, ref: r3_station}
      - id: r3_bar_right
        cx: {offset: r3_bar_spacing / 2, pos: cx, ref: r3_station}
        cy: {offset: 0, pos: cy, ref: r3_station}
        cz: {offset: -12.5, pos: cz, ref: r3_station}

  - id: r3_binding_cross_left_0
    class: IfcBuildingElementProxy
    size: [55, 4, 4]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    label: 'Crossing binding: schematic loop; GRP carries gravity load'
    label_id: L
    relate:
      orient: {axis: +x, vector: [33, 44, 0]}
    place:
      - id: r3_binding_top_left_0
        cx: {offset: -r3_bar_spacing / 2, pos: cx, ref: r3_station}
        cy: {offset: 0, pos: cy, ref: r3_station}
        cz: {offset: 2, pos: cz, ref: r3_station}
      - id: r3_binding_bottom_left_0
        cx: {offset: -r3_bar_spacing / 2, pos: cx, ref: r3_station}
        cy: {offset: 0, pos: cy, ref: r3_station}
        cz: {offset: -65, pos: cz, ref: r3_station}

  - id: r3_binding_sides_left_0
    class: IfcBuildingElementProxy
    size: [4, 4, 63]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    place:
      - id: r3_binding_west_left_0
        cx: {offset: -r3_bar_spacing / 2 - 16.5, pos: cx, ref: r3_station}
        cy: {offset: -22, pos: cy, ref: r3_station}
        cz: {offset: -31.5, pos: cz, ref: r3_station}
      - id: r3_binding_east_left_0
        cx: {offset: -r3_bar_spacing / 2 + 16.5, pos: cx, ref: r3_station}
        cy: {offset: 22, pos: cy, ref: r3_station}
        cz: {offset: -31.5, pos: cz, ref: r3_station}

  - id: r3_binding_cross_right_0
    class: IfcBuildingElementProxy
    size: [55, 4, 4]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    label: 'Crossing binding: schematic loop; GRP carries gravity load'
    label_id: L
    relate:
      orient: {axis: +x, vector: [33, 44, 0]}
    place:
      - id: r3_binding_top_right_0
        cx: {offset: r3_bar_spacing / 2, pos: cx, ref: r3_station}
        cy: {offset: 0, pos: cy, ref: r3_station}
        cz: {offset: 2, pos: cz, ref: r3_station}
      - id: r3_binding_bottom_right_0
        cx: {offset: r3_bar_spacing / 2, pos: cx, ref: r3_station}
        cy: {offset: 0, pos: cy, ref: r3_station}
        cz: {offset: -65, pos: cz, ref: r3_station}

  - id: r3_binding_sides_right_0
    class: IfcBuildingElementProxy
    size: [4, 4, 63]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    place:
      - id: r3_binding_west_right_0
        cx: {offset: r3_bar_spacing / 2 - 16.5, pos: cx, ref: r3_station}
        cy: {offset: -22, pos: cy, ref: r3_station}
        cz: {offset: -31.5, pos: cz, ref: r3_station}
      - id: r3_binding_east_right_0
        cx: {offset: r3_bar_spacing / 2 + 16.5, pos: cx, ref: r3_station}
        cy: {offset: 22, pos: cy, ref: r3_station}
        cz: {offset: -31.5, pos: cz, ref: r3_station}

  # Open stepped basket envelope; real tapered mesh and media omitted.
  # Base is a bearing envelope; the four 3 mm walls are diagrammatic, not a material specification.
  - id: r3_basket_base
    class: IfcBuildingElementProxy
    size: [r3_basket_base, r3_basket_base, 5]
    material: basket-polymer
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    label: 'B28: assumed 200 mm base, 280 mm rim, 190 mm tall; mesh/taper simplified'
    label_id: Q
    relate:
      cx: {pos: cx, ref: r3_station}
      cy: {pos: cy, ref: r3_station}
      -z: {pos: cz, ref: r3_station}

  - id: r3_basket_walls_x
    class: IfcBuildingElementProxy
    size: [3, r3_basket_base, r3_basket_height - 13]
    material: basket-polymer
    ifc: {predefined_type: ELEMENT}
    views: [plan, section]
    place:
      - id: r3_basket_wall_x_minus
        cx: {offset: -1 * (r3_basket_base / 2 - 1.5), pos: cx, ref: r3_station}
        cy: {offset: 0, pos: cy, ref: r3_station}
        cz: {offset: (r3_basket_height - 13) / 2 + 5, pos: cz, ref: r3_station}
      - id: r3_basket_wall_x_plus
        cx: {offset: 1 * (r3_basket_base / 2 - 1.5), pos: cx, ref: r3_station}
        cy: {offset: 0, pos: cy, ref: r3_station}
        cz: {offset: (r3_basket_height - 13) / 2 + 5, pos: cz, ref: r3_station}

  - id: r3_basket_rims_x
    class: IfcBuildingElementProxy
    size: [(r3_basket_rim - r3_basket_base) / 2 + 3, r3_basket_rim, 8]
    material: basket-polymer
    ifc: {predefined_type: ELEMENT}
    views: [plan, section]
    place:
      - id: r3_basket_rim_x_minus
        cx: {offset: -1 * (r3_basket_rim / 2 - ((r3_basket_rim - r3_basket_base) / 2 + 3) / 2), pos: cx, ref: r3_station}
        cy: {offset: 0, pos: cy, ref: r3_station}
        cz: {offset: r3_basket_height - 4, pos: cz, ref: r3_station}
      - id: r3_basket_rim_x_plus
        cx: {offset: 1 * (r3_basket_rim / 2 - ((r3_basket_rim - r3_basket_base) / 2 + 3) / 2), pos: cx, ref: r3_station}
        cy: {offset: 0, pos: cy, ref: r3_station}
        cz: {offset: r3_basket_height - 4, pos: cz, ref: r3_station}

  - id: r3_basket_walls_y
    class: IfcBuildingElementProxy
    size: [r3_basket_base - 6, 3, r3_basket_height - 13]
    material: basket-polymer
    ifc: {predefined_type: ELEMENT}
    views: [plan, section]
    place:
      - id: r3_basket_wall_y_minus
        cx: {offset: 0, pos: cx, ref: r3_station}
        cy: {offset: -1 * (r3_basket_base / 2 - 1.5), pos: cy, ref: r3_station}
        cz: {offset: (r3_basket_height - 13) / 2 + 5, pos: cz, ref: r3_station}
      - id: r3_basket_wall_y_plus
        cx: {offset: 0, pos: cx, ref: r3_station}
        cy: {offset: 1 * (r3_basket_base / 2 - 1.5), pos: cy, ref: r3_station}
        cz: {offset: (r3_basket_height - 13) / 2 + 5, pos: cz, ref: r3_station}

  - id: r3_basket_rims_y
    class: IfcBuildingElementProxy
    size: [r3_basket_base - 6, (r3_basket_rim - r3_basket_base) / 2 + 3, 8]
    material: basket-polymer
    ifc: {predefined_type: ELEMENT}
    views: [plan, section]
    place:
      - id: r3_basket_rim_y_minus
        cx: {offset: 0, pos: cx, ref: r3_station}
        cy: {offset: -1 * (r3_basket_rim / 2 - ((r3_basket_rim - r3_basket_base) / 2 + 3) / 2), pos: cy, ref: r3_station}
        cz: {offset: r3_basket_height - 4, pos: cz, ref: r3_station}
      - id: r3_basket_rim_y_plus
        cx: {offset: 0, pos: cx, ref: r3_station}
        cy: {offset: 1 * (r3_basket_rim / 2 - ((r3_basket_rim - r3_basket_base) / 2 + 3) / 2), pos: cy, ref: r3_station}
        cz: {offset: r3_basket_height - 4, pos: cz, ref: r3_station}

  - id: r3_basket_ties
    class: IfcBuildingElementProxy
    size: [4, 4, 30]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    label: Four removable lower basket ties; loops/holes/mesh engagement schematic
    label_id: T
    place:
      - id: r3_basket_tie_1
        cx: {offset: -80, pos: cx, ref: r3_station}
        cy: {offset: -102, pos: cy, ref: r3_station}
        cz: {offset: 5, pos: cz, ref: r3_station}
      - id: r3_basket_tie_2
        cx: {offset: -80, pos: cx, ref: r3_station}
        cy: {offset: 102, pos: cy, ref: r3_station}
        cz: {offset: 5, pos: cz, ref: r3_station}
      - id: r3_basket_tie_3
        cx: {offset: 80, pos: cx, ref: r3_station}
        cy: {offset: -102, pos: cy, ref: r3_station}
        cz: {offset: 5, pos: cz, ref: r3_station}
      - id: r3_basket_tie_4
        cx: {offset: 80, pos: cx, ref: r3_station}
        cy: {offset: 102, pos: cy, ref: r3_station}
        cz: {offset: 5, pos: cz, ref: r3_station}

  # Return rail envelopes shown in overall plan / 3D only, keeping south connection slices local.
  - id: r3_rail_north
    class: IfcBuildingElementProxy
    size: [2 * r3_line + r3_rail_size, r3_rail_size, r3_rail_size]
    material: grp
    ifc: {predefined_type: ELEMENT}
    views: [plan]
    label: Ring return sides; 24 other-bank supports and bolted mitres omitted
    label_id: N
    relate:
      cx: 0
      cy: r3_line
      +z: r3_rail_top

  # Butted envelope solids give the same outside ring as four mitred members.
  # Actual corners: paired 6 mm GRP L plates, four M6 bolts per corner; see R3-rail.md.
  - id: r3_rail_returns
    class: IfcBuildingElementProxy
    size: [r3_rail_size, 2 * r3_line - r3_rail_size, r3_rail_size]
    material: grp
    ifc: {predefined_type: ELEMENT}
    views: [plan]
    place:
      - id: r3_rail_west
        cx: -1 * r3_line
        cy: 0
        +z: r3_rail_top
      - id: r3_rail_east
        cx: 1 * r3_line
        cy: 0
        +z: r3_rail_top

# Sections are real slices, not elevations. Choose the left bar/bolt X to see its connection.
views:
  plan:
    title: "R3 — overall; J3/J4 supports shown; 30 other ring supports noted"
    scale_hint: 0.24
    renders: [svg, png]
  seat-plan:
    title: "R3 — basket base and seat; rim, long rails and joists hidden"
    scale_hint: 2
    renders: [svg, png]
  section:
    title: "R3 — basket section; water Z=0, deck underside Z=150"
    scale_hint: 0.9
    plane: {axis: x, coordinate: r3_basket_x - r3_bar_spacing / 2}
  connection:
    title: "R3 — connection slice; sleeves/bolts are envelopes, not drilled solids"
    scale_hint: 2
    plane: {axis: x, coordinate: r3_basket_x - r3_bar_spacing / 2}
  suspension:
    title: "R3 — J4 joist-to-rail slice; cord path schematic, two turns required"
    scale_hint: 0.65
    plane: {axis: x, coordinate: r3_joist_4_x}

