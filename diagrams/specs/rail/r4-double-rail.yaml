      orient: {axis: +x, vector: [0.0, 203, r4_rail_top - 19 - (beam_height - joist_depth - 3)]}

  - id: r4_lower_4_2
    kind: reference
    size: [0, 0, 0]
    relate:
      cx: -108.5
      cy: {pos: cy, ref: r4_rail_inner}
      cz: {pos: cz, ref: r4_rail_inner}

  - id: r4_lower_wrap_cross_4_2
    class: IfcBuildingElementProxy
    size: [6, 44, 6]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    place:
      - id: r4_lower_wrap_top_4_2
