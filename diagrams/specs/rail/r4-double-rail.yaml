# R4 Double Rail — editable comparison model, millimetres.
# Read docs/packs/c/R4-double-rail.md and README.md in this directory.
# Same origin/orientation as option-c.yaml: pond centre X/Y=0, water/pad tops Z=0.
# CONTEXT components are removable when combining with Option C; reuse its datums/joists.
# One B28 station only. Basket base is assumed; no final planting layout is implied.
# Hollow GRP, cord wraps and hardware are envelope solids, not manufacturing bores.
# Use --collision-mode ignore for declared envelope overlaps; audit with warn first.
# Sloping cord lengths below are explicit because expressions have no sqrt().
# If changing water/rail/joist dimensions, recompute these lengths from the shown vectors.
# Ring corners and contact overlaps are documented in README.md; no hidden structural credit.
schema: pond-relationship-rail-study
info:
  option: R4
  title: "R4 — Double Rail"
  description: "Unresolved same-bank suspension; one side only. See R4-double-rail.md."

dimensions:
  interface:
    pad_top_z: 0
    water_surface_z: pad_top_z
    deck_span: 5000
    pond_span: 3000
    cantilever: 350
    beam_height: 150
    joist_depth: 75
    joist_width: 47
    beam_width: 47
    backspan: 1000
    deck_thickness: 28
    opening_width: pond_span - 2 * cantilever
  rail:
    r4_line: pond_span / 2 - 450
    r4_rail_size: 38
    r4_bearing_depth: 200
    r4_seat_depth: 25
    r4_rail_top: water_surface_z - r4_bearing_depth - r4_seat_depth
    r4_basket_x: -260
    r4_basket_rim: 280
    r4_basket_base: 200
    r4_basket_height: 190
    r4_bar_length: r4_basket_base + 30
    r4_bar_spacing: r4_basket_base - 40
    r4_rail_separation: 150
    r4_joist_1_x: -1226.5
    r4_joist_2_x: -839.833333
    r4_joist_3_x: -419.916667
    r4_joist_4_x: -108.5
    r4_joist_5_x: 108.5
    r4_joist_6_x: 419.916667
    r4_joist_7_x: 839.833333
    r4_joist_8_x: 1226.5

components:
  # CONTEXT: reuse the identically named Option C reference.
  - id: origin
    kind: reference
    size: [0, 0, 0]

  # CONTEXT: reuse the identically named Option C reference.
  - id: deck_frame
    kind: reference
    size: [deck_span, deck_span, 0]

  # CONTEXT: reuse the identically named Option C reference.
  - id: pond_frame
    kind: reference
    size: [pond_span, pond_span, 0]

  # CONTEXT: reuse the identically named Option C reference.
  - id: opening_frame
    kind: reference
    size: [opening_width, opening_width, 0]

  # CONTEXT: identical south joist IDs/positions to Option C; omit on integration.
  - id: joist_run_south
    class: IfcBuildingElementProxy
    size: [joist_width, backspan + cantilever - beam_width, joist_depth]
    material: timber
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    label: 'Context: as-built south joists; upper wraps need future access'
    label_id: J
    place:
      - id: joist_run_south_1
        cx: r4_joist_1_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_2
        cx: r4_joist_2_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_3
        cx: r4_joist_3_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_4
        cx: r4_joist_4_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_5
        cx: r4_joist_5_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_6
        cx: r4_joist_6_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_7
        cx: r4_joist_7_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height
      - id: joist_run_south_8
        cx: r4_joist_8_x
        -y: -deck_span / 2 + beam_width
        +z: beam_height

  # CONTEXT display line only; delete on integration.
  - id: r4_water_line
    class: IfcBuildingElementProxy
    size: [600, 500, 1]
    material: water
    ifc: {predefined_type: ELEMENT}
    views: [section, suspension]
    label: Water datum Z=0 = pad tops / beam undersides (line only)
    label_id: W
    relate:
      cx: r4_basket_x
      cy: -r4_line
      cz: water_surface_z

  # CONTEXT display strip only; delete on integration.
  - id: r4_deck_edge
    class: IfcBuildingElementProxy
    size: [600, 1, deck_thickness]
    material: decking
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    label: Finished deck edge; 350 mm overhang (line only)
    label_id: D
    relate:
      cx: r4_basket_x
      cy: {pos: -y, ref: opening_frame}
      -z: beam_height

  # R4: no automatic rotation; adjacent full-length ladders would clash.
  - id: r4_rail_outer
    class: IfcBuildingElementProxy
    size: [2 * r4_line, r4_rail_size, r4_rail_size]
    material: grp
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, connection, suspension]
    label: 'Two-rail module: same-bank cords do not hold this position'
    label_id: R
    relate:
      cx: {pos: cx, ref: pond_frame}
      cy: -r4_line - r4_rail_separation / 2
      +z: r4_rail_top

  # R4: no automatic rotation; adjacent full-length ladders would clash.
  - id: r4_rail_inner
    class: IfcBuildingElementProxy
    size: [2 * r4_line, r4_rail_size, r4_rail_size]
    material: grp
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, connection, suspension]
    label: 'Two-rail module: same-bank cords do not hold this position'
    label_id: R
    relate:
      cx: {pos: cx, ref: pond_frame}
      cy: -r4_line + r4_rail_separation / 2
      +z: r4_rail_top

  # EDIT THIS STATION to move the entire basket and local support together.
  # South side: X along rail, +Y pondward. CZ is basket bearing surface.
  - id: r4_station
    kind: reference
    size: [0, 0, 0]
    relate:
      cx: r4_basket_x
      cy: {offset: 450, pos: -y, ref: pond_frame}
      cz: water_surface_z - r4_bearing_depth

  - id: r4_upper_3
    kind: reference
    size: [0, 0, 0]
    relate:
      cx: {pos: cx, ref: joist_run_south_3}
      cy: {offset: -50, pos: +y, ref: joist_run_south_3}
      cz: {offset: -3, pos: -z, ref: joist_run_south_3}

  - id: r4_joist_wrap_cross_3
    class: IfcBuildingElementProxy
    size: [53, 6, 6]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    label: '6 mm polyester support: two turns, chafe sleeves, backed knot; keeper omitted'
    label_id: C
    place:
      - id: r4_joist_wrap_bottom_3
        cx: {offset: 0, pos: cx, ref: r4_upper_3}
        cy: {offset: 0, pos: cy, ref: r4_upper_3}
        cz: {offset: 0, pos: cz, ref: r4_upper_3}
      - id: r4_joist_wrap_top_3
        cx: {offset: 0, pos: cx, ref: r4_upper_3}
        cy: {offset: 0, pos: cy, ref: r4_upper_3}
        cz: {offset: 81, pos: cz, ref: r4_upper_3}

  - id: r4_joist_wrap_sides_3
    class: IfcBuildingElementProxy
    size: [6, 6, 75]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    place:
      - id: r4_joist_wrap_left_3
        cx: {offset: -26.5, pos: cx, ref: r4_upper_3}
        cy: {offset: 0, pos: cy, ref: r4_upper_3}
        cz: {offset: 40.5, pos: cz, ref: r4_upper_3}
      - id: r4_joist_wrap_right_3
        cx: {offset: 26.5, pos: cx, ref: r4_upper_3}
        cy: {offset: 0, pos: cy, ref: r4_upper_3}
        cz: {offset: 40.5, pos: cz, ref: r4_upper_3}

  # Cord centreline vector (0, 53, rail_top - 91); length is its Euclidean norm.
  # End stations land at rail ends; other stations align with actual joist X.
  - id: r4_drop_3_1
    class: IfcBuildingElementProxy
    size: [320.413795, 6, 6]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    relate:
      cx: {offset: 0.0, pos: cx, ref: r4_upper_3}
      cy: {offset: 26.5, pos: cy, ref: r4_upper_3}
      cz: {offset: (r4_rail_top - 19 - (beam_height - joist_depth - 3)) / 2, pos: cz, ref: r4_upper_3}
      orient: {axis: +x, vector: [0.0, 53, r4_rail_top - 19 - (beam_height - joist_depth - 3)]}

  - id: r4_lower_3_1
    kind: reference
    size: [0, 0, 0]
    relate:
      cx: -419.916667
      cy: {pos: cy, ref: r4_rail_outer}
      cz: {pos: cz, ref: r4_rail_outer}

  - id: r4_lower_wrap_cross_3_1
    class: IfcBuildingElementProxy
    size: [6, 44, 6]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    place:
      - id: r4_lower_wrap_top_3_1
        cx: {offset: 0, pos: cx, ref: r4_lower_3_1}
        cy: {offset: 0, pos: cy, ref: r4_lower_3_1}
        cz: {offset: 22, pos: cz, ref: r4_lower_3_1}
      - id: r4_lower_wrap_bottom_3_1
        cx: {offset: 0, pos: cx, ref: r4_lower_3_1}
        cy: {offset: 0, pos: cy, ref: r4_lower_3_1}
        cz: {offset: -22, pos: cz, ref: r4_lower_3_1}

  # One envelope turn shown; use two actual turns and collars either side, per R3.
  - id: r4_lower_wrap_sides_3_1
    class: IfcBuildingElementProxy
    size: [6, 6, 38]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    place:
      - id: r4_lower_wrap_bank_3_1
        cx: {offset: 0, pos: cx, ref: r4_lower_3_1}
        cy: {offset: -22, pos: cy, ref: r4_lower_3_1}
        cz: {offset: 0, pos: cz, ref: r4_lower_3_1}
      - id: r4_lower_wrap_pond_3_1
        cx: {offset: 0, pos: cx, ref: r4_lower_3_1}
        cy: {offset: 22, pos: cy, ref: r4_lower_3_1}
        cz: {offset: 0, pos: cz, ref: r4_lower_3_1}

  # Cord centreline vector (0, 203, rail_top - 91); length is its Euclidean norm.
  # End stations land at rail ends; other stations align with actual joist X.
  - id: r4_drop_3_2
    class: IfcBuildingElementProxy
