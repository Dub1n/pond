        cy: {offset: 0, pos: cy, ref: r4_lower_4_1}
        cz: {offset: 22, pos: cz, ref: r4_lower_4_1}
      - id: r4_lower_wrap_bottom_4_1
        cx: {offset: 0, pos: cx, ref: r4_lower_4_1}
        cy: {offset: 0, pos: cy, ref: r4_lower_4_1}
