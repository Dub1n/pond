# Sections are real slices, not elevations. Choose the left bar/bolt X to see its connection.
views:
  plan:
    title: "R4 — overall; one side; J3/J4 forked suspension UNRESOLVED"
    scale_hint: 0.24
    renders: [svg, png]
  seat-plan:
    title: "R4 — basket base and seat; rim, long rails and joists hidden"
    scale_hint: 2
    renders: [svg, png]
  section:
    title: "R4 — basket section; water Z=0, deck underside Z=150"
    scale_hint: 0.9
    plane: {axis: x, coordinate: r4_basket_x - r4_bar_spacing / 2}
  connection:
    title: "R4 — connection slice; sleeves/bolts are envelopes, not drilled solids"
    scale_hint: 2
    plane: {axis: x, coordinate: r4_basket_x - r4_bar_spacing / 2}
  suspension:
    title: "R4 — J4 joist-to-rail slice; cord path schematic, two turns required"
    scale_hint: 0.65
    plane: {axis: x, coordinate: r4_joist_4_x}

