    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    place:
      - id: r4_lower_wrap_bank_4_1
        cx: {offset: 0, pos: cx, ref: r4_lower_4_1}
        cy: {offset: -22, pos: cy, ref: r4_lower_4_1}
        cz: {offset: 0, pos: cz, ref: r4_lower_4_1}
      - id: r4_lower_wrap_pond_4_1
