  - id: r4_joist_wrap_sides_4
    class: IfcBuildingElementProxy
    size: [6, 6, 75]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, section, suspension]
    place:
      - id: r4_joist_wrap_left_4
        cx: {offset: -26.5, pos: cx, ref: r4_upper_4}
        cy: {offset: 0, pos: cy, ref: r4_upper_4}
        cz: {offset: 40.5, pos: cz, ref: r4_upper_4}
      - id: r4_joist_wrap_right_4
        cx: {offset: 26.5, pos: cx, ref: r4_upper_4}
        cy: {offset: 0, pos: cy, ref: r4_upper_4}
        cz: {offset: 40.5, pos: cz, ref: r4_upper_4}

  # Cord centreline vector (0, 53, rail_top - 91); length is its Euclidean norm.
  # End stations land at rail ends; other stations align with actual joist X.
  - id: r4_drop_4_1
    class: IfcBuildingElementProxy
