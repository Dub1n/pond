      - id: r5_collar_left_bottom
        cx: {offset: -1 * (r5_plate_side / 2 + r5_collar_envelope / 2), pos: cx, ref: r5_station}
        cy: {offset: 0, pos: cy, ref: r5_station}
        cz: {offset: -r5_plate_thickness - r5_rail_size - 4, pos: cz, ref: r5_station}

  - id: r5_collar_left_sides
    class: IfcBuildingElementProxy
    size: [r5_collar_envelope, 8, 38]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    place:
      - id: r5_collar_left_bank
        cx: {offset: -1 * (r5_plate_side / 2 + r5_collar_envelope / 2), pos: cx, ref: r5_station}
        cy: {offset: -23, pos: cy, ref: r5_station}
        cz: {offset: -r5_plate_thickness - r5_rail_size / 2, pos: cz, ref: r5_station}
      - id: r5_collar_left_pond
        cx: {offset: -1 * (r5_plate_side / 2 + r5_collar_envelope / 2), pos: cx, ref: r5_station}
        cy: {offset: 23, pos: cy, ref: r5_station}
        cz: {offset: -r5_plate_thickness - r5_rail_size / 2, pos: cz, ref: r5_station}

  - id: r5_collar_right_cross
    class: IfcBuildingElementProxy
    size: [r5_collar_envelope, 46, 8]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    label: Multi-turn cord collars abut both plate edges; test against slip
    label_id: L
    place:
      - id: r5_collar_right_top
        cx: {offset: 1 * (r5_plate_side / 2 + r5_collar_envelope / 2), pos: cx, ref: r5_station}
        cy: {offset: 0, pos: cy, ref: r5_station}
        cz: {offset: -r5_plate_thickness + 4, pos: cz, ref: r5_station}
      - id: r5_collar_right_bottom
        cx: {offset: 1 * (r5_plate_side / 2 + r5_collar_envelope / 2), pos: cx, ref: r5_station}
        cy: {offset: 0, pos: cy, ref: r5_station}
        cz: {offset: -r5_plate_thickness - r5_rail_size - 4, pos: cz, ref: r5_station}

  - id: r5_collar_right_sides
    class: IfcBuildingElementProxy
    size: [r5_collar_envelope, 8, 38]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    place:
      - id: r5_collar_right_bank
        cx: {offset: 1 * (r5_plate_side / 2 + r5_collar_envelope / 2), pos: cx, ref: r5_station}
        cy: {offset: -23, pos: cy, ref: r5_station}
        cz: {offset: -r5_plate_thickness - r5_rail_size / 2, pos: cz, ref: r5_station}
      - id: r5_collar_right_pond
        cx: {offset: 1 * (r5_plate_side / 2 + r5_collar_envelope / 2), pos: cx, ref: r5_station}
        cy: {offset: 23, pos: cy, ref: r5_station}
        cz: {offset: -r5_plate_thickness - r5_rail_size / 2, pos: cz, ref: r5_station}

  # Open stepped basket envelope; real tapered mesh and media omitted.
  # Base is a bearing envelope; the four 3 mm walls are diagrammatic, not a material specification.
  - id: r5_basket_base
    class: IfcBuildingElementProxy
    size: [r5_basket_base, r5_basket_base, 5]
    material: basket-polymer
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    label: 'B28: assumed 200 mm base, 280 mm rim, 190 mm tall; mesh/taper simplified'
    label_id: Q
    relate:
      cx: {pos: cx, ref: r5_station}
      cy: {pos: cy, ref: r5_station}
      -z: {pos: cz, ref: r5_station}

  - id: r5_basket_walls_x
    class: IfcBuildingElementProxy
    size: [3, r5_basket_base, r5_basket_height - 13]
    material: basket-polymer
    ifc: {predefined_type: ELEMENT}
    views: [plan, section]
    place:
      - id: r5_basket_wall_x_minus
        cx: {offset: -1 * (r5_basket_base / 2 - 1.5), pos: cx, ref: r5_station}
        cy: {offset: 0, pos: cy, ref: r5_station}
        cz: {offset: (r5_basket_height - 13) / 2 + 5, pos: cz, ref: r5_station}
      - id: r5_basket_wall_x_plus
        cx: {offset: 1 * (r5_basket_base / 2 - 1.5), pos: cx, ref: r5_station}
        cy: {offset: 0, pos: cy, ref: r5_station}
        cz: {offset: (r5_basket_height - 13) / 2 + 5, pos: cz, ref: r5_station}

  - id: r5_basket_rims_x
    class: IfcBuildingElementProxy
    size: [(r5_basket_rim - r5_basket_base) / 2 + 3, r5_basket_rim, 8]
    material: basket-polymer
    ifc: {predefined_type: ELEMENT}
    views: [plan, section]
    place:
      - id: r5_basket_rim_x_minus
        cx: {offset: -1 * (r5_basket_rim / 2 - ((r5_basket_rim - r5_basket_base) / 2 + 3) / 2), pos: cx, ref: r5_station}
