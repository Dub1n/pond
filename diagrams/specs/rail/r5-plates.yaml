        cx: {offset: -1 * r5_bolt_x, pos: cx, ref: r5_station}
        cy: {offset: 1 * r5_bolt_y, pos: cy, ref: r5_station}
        cz: {offset: 6, pos: cz, ref: r5_station}
      - id: r5_nut_3
        cx: {offset: 1 * r5_bolt_x, pos: cx, ref: r5_station}
        cy: {offset: -1 * r5_bolt_y, pos: cy, ref: r5_station}
        cz: {offset: 6, pos: cz, ref: r5_station}
      - id: r5_nut_4
        cx: {offset: 1 * r5_bolt_x, pos: cx, ref: r5_station}
        cy: {offset: 1 * r5_bolt_y, pos: cy, ref: r5_station}
        cz: {offset: 6, pos: cz, ref: r5_station}

  - id: r5_cap
    class: IfcBuildingElementProxy
    size: [10, 10, 62 - (2 * r5_plate_thickness + r5_sleeve_length + 2)]
    material: a4-stainless
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    place:
      - id: r5_cap_1
        cx: {offset: -1 * r5_bolt_x, pos: cx, ref: r5_station}
        cy: {offset: -1 * r5_bolt_y, pos: cy, ref: r5_station}
        cz: {offset: 10 + (62 - (2 * r5_plate_thickness + r5_sleeve_length + 2)) / 2, pos: cz, ref: r5_station}
      - id: r5_cap_2
        cx: {offset: -1 * r5_bolt_x, pos: cx, ref: r5_station}
        cy: {offset: 1 * r5_bolt_y, pos: cy, ref: r5_station}
        cz: {offset: 10 + (62 - (2 * r5_plate_thickness + r5_sleeve_length + 2)) / 2, pos: cz, ref: r5_station}
      - id: r5_cap_3
        cx: {offset: 1 * r5_bolt_x, pos: cx, ref: r5_station}
        cy: {offset: -1 * r5_bolt_y, pos: cy, ref: r5_station}
        cz: {offset: 10 + (62 - (2 * r5_plate_thickness + r5_sleeve_length + 2)) / 2, pos: cz, ref: r5_station}
      - id: r5_cap_4
        cx: {offset: 1 * r5_bolt_x, pos: cx, ref: r5_station}
        cy: {offset: 1 * r5_bolt_y, pos: cy, ref: r5_station}
        cz: {offset: 10 + (62 - (2 * r5_plate_thickness + r5_sleeve_length + 2)) / 2, pos: cz, ref: r5_station}

  - id: r5_collar_left_cross
    class: IfcBuildingElementProxy
    size: [r5_collar_envelope, 46, 8]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    label: Multi-turn cord collars abut both plate edges; test against slip
    label_id: L
    place:
      - id: r5_collar_left_top
        cx: {offset: -1 * (r5_plate_side / 2 + r5_collar_envelope / 2), pos: cx, ref: r5_station}
