        cz: {offset: r5_basket_height - 4, pos: cz, ref: r5_station}

  - id: r5_basket_ties
    class: IfcBuildingElementProxy
    size: [4, 4, 30]
    material: polyester
    ifc: {predefined_type: ELEMENT}
    views: [plan, seat-plan, section, connection, suspension]
    label: Four removable lower basket ties; loops/holes/mesh engagement schematic
    label_id: T
    place:
      - id: r5_basket_tie_1
        cx: {offset: -80, pos: cx, ref: r5_station}
        cy: {offset: -102, pos: cy, ref: r5_station}
        cz: {offset: 5, pos: cz, ref: r5_station}
      - id: r5_basket_tie_2
        cx: {offset: -80, pos: cx, ref: r5_station}
        cy: {offset: 102, pos: cy, ref: r5_station}
        cz: {offset: 5, pos: cz, ref: r5_station}
      - id: r5_basket_tie_3
        cx: {offset: 80, pos: cx, ref: r5_station}
        cy: {offset: -102, pos: cy, ref: r5_station}
        cz: {offset: 5, pos: cz, ref: r5_station}
      - id: r5_basket_tie_4
        cx: {offset: 80, pos: cx, ref: r5_station}
        cy: {offset: 102, pos: cy, ref: r5_station}
        cz: {offset: 5, pos: cz, ref: r5_station}

  # Return rail envelopes shown in overall plan / 3D only, keeping south connection slices local.
  - id: r5_rail_north
    class: IfcBuildingElementProxy
    size: [2 * r5_line + r5_rail_size, r5_rail_size, r5_rail_size]
    material: grp
    ifc: {predefined_type: ELEMENT}
    views: [plan]
    label: Ring return sides; 24 other-bank supports and bolted mitres omitted
    label_id: N
    relate:
      cx: 0
      cy: r5_line
      +z: r5_rail_top

  # Butted envelope solids give the same outside ring as four mitred members.
  # Actual corners: paired 6 mm GRP L plates, four M6 bolts per corner; see R3-rail.md.
  - id: r5_rail_returns
    class: IfcBuildingElementProxy
    size: [r5_rail_size, 2 * r5_line - r5_rail_size, r5_rail_size]
    material: grp
    ifc: {predefined_type: ELEMENT}
    views: [plan]
    place:
      - id: r5_rail_west
        cx: -1 * r5_line
        cy: 0
        +z: r5_rail_top
      - id: r5_rail_east
        cx: 1 * r5_line
        cy: 0
        +z: r5_rail_top

# Sections are real slices, not elevations. Choose the left bar/bolt X to see its connection.
views:
  plan:
    title: "R5 — overall; J3/J4 supports shown; 30 other ring supports noted"
    scale_hint: 0.24
    renders: [svg, png]
  seat-plan:
    title: "R5 — basket base and seat; rim, long rails and joists hidden"
    scale_hint: 2
    renders: [svg, png]
  section:
    title: "R5 — basket section; water Z=0, deck underside Z=150"
    scale_hint: 0.9
    plane: {axis: x, coordinate: r5_basket_x - r5_bar_spacing / 2}
  connection:
    title: "R5 — connection slice; sleeves/bolts are envelopes, not drilled solids"
    scale_hint: 2
    plane: {axis: x, coordinate: r5_basket_x - r5_bolt_x}
  suspension:
    title: "R5 — J4 joist-to-rail slice; cord path schematic, two turns required"
    scale_hint: 0.65
    plane: {axis: x, coordinate: r5_joist_4_x}

