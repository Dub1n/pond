    place:
      - id: r5_basket_rim_y_minus
        cx: {offset: 0, pos: cx, ref: r5_station}
        cy: {offset: -1 * (r5_basket_rim / 2 - ((r5_basket_rim - r5_basket_base) / 2 + 3) / 2), pos: cy, ref: r5_station}
