        cx: {offset: 0, pos: cx, ref: r5_station}
        cy: {offset: 1 * (r5_basket_base / 2 - 1.5), pos: cy, ref: r5_station}
        cz: {offset: (r5_basket_height - 13) / 2 + 5, pos: cz, ref: r5_station}

  - id: r5_basket_rims_y
    class: IfcBuildingElementProxy
    size: [r5_basket_base - 6, (r5_basket_rim - r5_basket_base) / 2 + 3, 8]
