schema: pond-phase4-ergonomics-alpha
info:
  option: C
  title: "Option C — Phase 4 relationship-first schema sketch"
  description: >
    Illustrative Phase 4 rewrite of Option C using IFC-aligned axes, relationship
    constraints, datum bundles, face batching, and rotation helpers. Emphasises
    readable intent with minimal boilerplate.

dimensions:
  structure:
    deck_span: 5000
    pond_span: 3000
    backspan: 1000
    cantilever: 250
    walkway_gap: 430
    joist_spacing: 400
    joist_width: 140
    joist_depth: 150
    beam_width: 180
    beam_height: 150
    deck_clearance: 100
    joist_elevation: 0
  finishes:
    deck_thickness: 28
  site:
    water_depth: 900
    pad_size: 300
    pad_height: 100

datums:
  anchor:
    type: point
    coordinates:
      +x: 0
      +y: 0
      +z: 0
  bundles:
    deck_faces:
      type: faces
      origin:
        ref: datums.anchor
      span:
        +x: dimensions.structure.deck_span
        +y: dimensions.structure.deck_span
    pond_faces:
      type: faces
      origin:
        ref: datums.anchor
        translate:
          +x: dimensions.structure.backspan
          +y: dimensions.structure.backspan
      span:
        +x: dimensions.structure.pond_span
        +y: dimensions.structure.pond_span
  planes:
    joist_top:
      base:
        ref: datums.anchor
      normal: +z
      offset: dimensions.structure.joist_elevation
    deck_surface:
      base:
        ref: datums.planes.joist_top
      offset: dimensions.finishes.deck_thickness
    water_surface:
      base:
        ref: datums.planes.joist_top
      offset: -dimensions.structure.deck_clearance
    water_bottom:
      base:
        ref: datums.planes.water_surface
      offset: -dimensions.site.water_depth
    pad_top:
      base:
        ref: datums.planes.joist_top
      offset: -dimensions.structure.joist_depth

components:
  - id: pond_water
    class: PondWater
    profile: rectangle
    size: [dimensions.structure.pond_span, dimensions.structure.pond_span]
    height: dimensions.site.water_depth
    material: water
    relate:
      - flush_bundle:
          bundle: datums.bundles.pond_faces
      - touch_planes:
          object: datums.planes.water_surface
          faces: [+z]
      - touch_planes:
          object: datums.planes.water_bottom
          faces: [-z]

  - id: deck_surface
    class: DeckSurface
    profile: rectangle
    size: [dimensions.structure.deck_span, dimensions.structure.deck_span]
    height: dimensions.finishes.deck_thickness
    material: decking
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
      - touch_planes:
          object: datums.planes.joist_top
          faces: [-z]
      - touch_planes:
          object: datums.planes.deck_surface
          faces: [+z]
    voids:
      - ref: pond_water

  - id: outer_beam_west
    class: IfcBeam
    profile: rectangle
    size: [dimensions.structure.beam_width, dimensions.structure.deck_span]
    height: dimensions.structure.beam_height
    material: timber
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-x, -y, +y]
      - touch_planes:
          object: datums.planes.joist_top
          faces: [+z]
      - touch_planes:
          object: datums.planes.pad_top
          faces: [-z]

  - use: assembly.rotate_quadrants
    with:
      source: outer_beam_west
      ids:
        east: outer_beam_east
        north: outer_beam_north
        south: outer_beam_south
      about:
        point: datums.anchor
        axis: +z

  - id: inner_beam_west
    class: IfcBeam
    profile: rectangle
    size:
      - dimensions.structure.beam_width
      - dimensions.structure.pond_span + 2 * dimensions.structure.beam_width
    height: dimensions.structure.beam_height
    material: timber
    relate:
      - flush_bundle:
          bundle: datums.bundles.pond_faces
          faces:
            - subject: +x
              object: -x
            - subject: -y
              object: -y
            - subject: +y
              object: +y
          inset:
            subject:
              -y: -dimensions.structure.beam_width
              +y: dimensions.structure.beam_width
      - touch_planes:
          object: datums.planes.joist_top
          faces: [+z]
      - touch_planes:
          object: datums.planes.pad_top
          faces: [-z]

  - use: assembly.rotate_quadrants
    with:
      source: inner_beam_west
      ids:
        east: inner_beam_east
        north: inner_beam_north
        south: inner_beam_south
      about:
        point: datums.anchor
        axis: +z

  - id: joist_run_west
    class: IfcJoist
    profile: rectangle
    size:
      - dimensions.structure.backspan + dimensions.structure.cantilever + dimensions.structure.beam_width
      - dimensions.structure.joist_width
    height: dimensions.structure.joist_depth
    material: timber
    relate:
      - touch_components:
          pairs:
            - subject_face: -x
              object_face: +x
              object_component: outer_beam_west
            - subject_face: +x
              object_face: +x
              object_component: inner_beam_west
              offsets:
                subject:
                  +x: dimensions.structure.cantilever
      - touch_planes:
          object: datums.planes.joist_top
          faces: [+z]
    repeat:
      axis: +y
      span:
        use: datums.bundles.deck_faces.y
        inset:
          start: dimensions.structure.walkway_gap
          end: dimensions.structure.walkway_gap
      pitch: dimensions.structure.joist_spacing
      include_seed: true

  - use: assembly.rotate_quadrants
    with:
      source: joist_run_west
      ids:
        east: joist_run_east
        north: joist_run_north
        south: joist_run_south
      about:
        point: datums.anchor
        axis: +z

  - id: pad_belt_west
    class: Pad
    profile: rectangle
    size: [dimensions.site.pad_size, dimensions.site.pad_size]
    height: dimensions.site.pad_height
    material: pad
    relate:
      - touch_planes:
          object: datums.planes.pad_top
          faces: [+z]
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-x, -y]
          inset:
            subject:
              -x: -dimensions.structure.beam_width / 2
              -y: -dimensions.structure.walkway_gap
    repeat:
      axis: +y
      span:
        use: datums.bundles.deck_faces.y
        inset:
          start: dimensions.structure.walkway_gap
          end: dimensions.structure.walkway_gap
      pitch: 1500
      include_seed: true

  - use: assembly.rotate_quadrants
    with:
      source: pad_belt_west
      ids:
        east: pad_belt_east
        north: pad_belt_north
        south: pad_belt_south
      about:
        point: datums.anchor
        axis: +z

  - use: assembly.linear_bracing
    with:
      id: strap_brace_outer
      path:
        start:
          component: outer_beam_south
          face: +y
        end:
          component: outer_beam_north
          face: -y
      attach:
        face: +z
        plane: datums.planes.deck_surface
      material: hardware
      description: "Flat strap X-brace tying outer beams"

views:
  plan:
    title: "Plan — Option C relationship-first schema example"
    scale_hint: 0.18
    renders:
      - svg
      - png
  section:
    title: "Section — Option C relationship-first schema example"
    plane:
      axis: +y
      coordinate: dimensions.structure.deck_span / 2
