schema: pond-relationship-ergonomics-alpha
info:
  option: C
  title: "Option C — Phase 4 relationship-first schema sketch"
  description: >
    Illustrative Phase 4 rewrite of Option C using IFC-aligned axes, relationship
    constraints, datum bundles, face batching, and rotation helpers. Emphasises
    readable intent with minimal boilerplate. Bundles and placements are centered
    around the origin to simplify rotation-based assemblies.

dimensions:
  structure:
    deck_span: 5000
    pond_span: 3000
    backspan: 1000
    cantilever: 250
    walkway_gap: 0
    joist_spacing: 400
    joist_width: 47
    joist_depth: 150
    beam_width: 47
    beam_height: 150
    deck_clearance: 100
    joist_elevation: 0
    corner_diagonal_length: 1768
    corner_tie_spacing: 500
  finishes:
    deck_thickness: 28
  site:
    water_depth: 900
    pad_size: 300
    pad_height: 100

datums:
  anchor:
    type: point
    coordinates:
      +x: 0
      +y: 0
      +z: 0
  bundles:
    deck_faces:
      type: faces
      origin:
        ref: datums.anchor
      translate:
        +x: -dimensions.structure.deck_span / 2
        +y: -dimensions.structure.deck_span / 2
      span:
        +x: dimensions.structure.deck_span
        +y: dimensions.structure.deck_span
    pond_faces:
      type: faces
      origin:
        ref: datums.anchor
      translate:
        +x: -dimensions.structure.pond_span / 2
        +y: -dimensions.structure.pond_span / 2
      span:
        +x: dimensions.structure.pond_span
        +y: dimensions.structure.pond_span
  pad_first_y:
    type: point
    coordinates:
      +y: (dimensions.structure.pond_span - 2 * dimensions.structure.cantilever) / 2
      +x: (dimensions.structure.pond_span - 2 * dimensions.structure.cantilever) / 2
  pad_sixth_y:
    type: point
    coordinates:
      +y: (dimensions.structure.pond_span - 2 * dimensions.structure.cantilever) / 2 - 5 * ((dimensions.structure.pond_span - 2 * dimensions.structure.cantilever) / 6)
      +x: (dimensions.structure.pond_span - 2 * dimensions.structure.cantilever) / 2 - 5 * ((dimensions.structure.pond_span - 2 * dimensions.structure.cantilever) / 6)
  planes:
    joist_top:
      base:
        ref: datums.anchor
      normal: +z
      offset: dimensions.structure.joist_elevation
    deck_surface:
      base:
        ref: datums.planes.joist_top
      normal: +z
      offset: dimensions.finishes.deck_thickness
    water_surface:
      base:
        ref: datums.planes.joist_top
      normal: +z
      offset: -dimensions.structure.deck_clearance
    water_bottom:
      base:
        ref: datums.planes.water_surface
      normal: +z
      offset: -dimensions.site.water_depth
    pad_top:
      base:
        ref: datums.planes.joist_top
      normal: +z
      offset: -dimensions.structure.joist_depth

components:
  - id: pond_water
    class: PondWater
    profile: rectangle
    size:
      - dimensions.structure.pond_span
      - dimensions.structure.pond_span
      - dimensions.site.water_depth
    material: water
    label: "Pond water"
    label_id: "C2"
    relate:
      - flush_bundle:
          bundle: datums.bundles.pond_faces
          faces: [+x, -x, +y, -y]
      - touch_planes:
          object: datums.planes.water_surface
          faces: [+z]
      - touch_planes:
          object: datums.planes.water_bottom
          faces: [-z]

  - id: pond_opening
    class: IfcOpeningElement
    profile: rectangle
    size:
      - dimensions.structure.pond_span - 2 * dimensions.structure.cantilever
      - dimensions.structure.pond_span - 2 * dimensions.structure.cantilever
      - dimensions.finishes.deck_thickness
    relate:
      - flush_bundle:
          bundle: datums.bundles.pond_faces
          faces: [+x, -x, +y, -y]
          inset:
            subject: {}
            object:
              +x: -dimensions.structure.cantilever
              -x: -dimensions.structure.cantilever
              +y: -dimensions.structure.cantilever
              -y: -dimensions.structure.cantilever
      - touch_planes:
          object: datums.planes.joist_top
          faces: [-z]
      - touch_planes:
          object: datums.planes.deck_surface
          faces: [+z]
    metadata:
      views: [section]

  - id: deck_surface
    class: DeckSurface
    profile: rectangle
    size:
      - dimensions.structure.deck_span
      - dimensions.structure.deck_span
      - dimensions.finishes.deck_thickness
    material: decking
    label: "Deck surface (1.0 m backspan + 0.25 m overhang)"
    label_id: "C1"
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [+x, -x, +y, -y]
      - touch_planes:
          object: datums.planes.joist_top
          faces: [-z]
      - touch_planes:
          object: datums.planes.deck_surface
          faces: [+z]
    voids:
      - ref: pond_opening

  - id: outer_beam_west
    class: IfcBeam
    profile: rectangle
    size:
      - dimensions.structure.beam_width
      - dimensions.structure.deck_span
      - dimensions.structure.beam_height
    material: timber
    label: "Support beam at outer rim"
    label_id: "C4"
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-x, -y, +y]
      - touch_planes:
          object: datums.planes.joist_top
          faces: [+z]
      - touch_planes:
          object: datums.planes.pad_top
          faces: [-z]

  - use: assembly.rotate_quadrants
    with:
      source: outer_beam_west
      ids:
        east: outer_beam_east
        north: outer_beam_north
        south: outer_beam_south
      about:
        point: datums.anchor
        axis: +z

  - id: inner_beam_west
    class: IfcBeam
    profile: rectangle
    size:
      - dimensions.structure.beam_width
      - dimensions.structure.deck_span
      - dimensions.structure.beam_height
    material: timber
    label: "Inner beam (saddle hanger rebate)"
    label_id: "C4B"
    relate:
      - flush_bundle:
          bundle: datums.bundles.pond_faces
          faces:
            - subject: +x
              object: -x
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-y, +y]
      - touch_planes:
          object: datums.planes.joist_top
          faces: [+z]
      - touch_planes:
          object: datums.planes.pad_top
          faces: [-z]

  - use: assembly.rotate_quadrants
    with:
      source: inner_beam_west
      ids:
        east: inner_beam_east
        north: inner_beam_north
        south: inner_beam_south
      about:
        point: datums.anchor
        axis: +z

  - id: joist_run_west
    class: IfcJoist
    profile: rectangle
    size:
      - dimensions.structure.backspan + dimensions.structure.cantilever - dimensions.structure.beam_width
      - dimensions.structure.joist_width
      - dimensions.structure.joist_depth
    material: timber
    label: "47×150 mm joist (1.0 m backspan + 0.25 m cantilever)"
    label_id: "C5"
    relate:
      - touch_components:
          pairs:
            - subject_face: -x
              object_face: +x
              object_component: outer_beam_west
      - touch_planes:
          object: datums.planes.joist_top
          faces: [+z]
      - run_between:
          start_pos: +y
          end_pos: -y
          from:
            ref: pond_opening
            pos: +y
          to:
            ref: pond_opening
            pos: -y
          count: 7
          orient: preserve_axes
          include_seed: true

  - use: assembly.rotate_quadrants
    with:
      source: joist_run_west
      ids:
        east: joist_run_east
        north: joist_run_north
        south: joist_run_south
      about:
        point: datums.anchor
        axis: +z

  - id: pad_belt_west
    class: Pad
    profile: rectangle
    size:
      - dimensions.site.pad_size
      - dimensions.site.pad_size
      - dimensions.site.pad_height
    material: pad
    label: "Shallow pad foundation"
    label_id: "C6"
    relate:
      - touch_planes:
          object: datums.planes.pad_top
          faces: [+z]
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-x, -y]
          inset:
            subject:
              -x: -dimensions.structure.beam_width / 2

  - use: assembly.rotate_quadrants
    with:
      source: pad_belt_west
      ids:
        east: pad_belt_east
        north: pad_belt_north
        south: pad_belt_south
      about:
        point: datums.anchor
        axis: +z

  - id: pad_first_west
    class: Pad
    profile: rectangle
    size:
      - dimensions.site.pad_size
      - dimensions.site.pad_size
      - dimensions.site.pad_height
    material: pad
    label: "Shallow pad foundation"
    label_id: "C6"
    relate:
      - touch_planes:
          object: datums.planes.pad_top
          faces: [+z]
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-x]
          inset:
            subject:
              -x: -dimensions.structure.beam_width / 2
      - align:
          subject:
            ref: self
            pos: +y
          object:
            ref: pad_first_y
            pos: +y

  - use: assembly.rotate_quadrants
    with:
      source: pad_first_west
      ids:
        east: pad_first_east
        north: pad_first_north
        south: pad_first_south
      about:
        point: datums.anchor
        axis: +z

  - id: pad_sixth_west
    class: Pad
    profile: rectangle
    size:
      - dimensions.site.pad_size
      - dimensions.site.pad_size
      - dimensions.site.pad_height
    material: pad
    label: "Shallow pad foundation"
    label_id: "C6"
    relate:
      - touch_planes:
          object: datums.planes.pad_top
          faces: [+z]
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-x]
          inset:
            subject:
              -x: -dimensions.structure.beam_width / 2
      - align:
          subject:
            ref: self
            pos: +y
          object:
            ref: pad_sixth_y
            pos: +y

  - use: assembly.rotate_quadrants
    with:
      source: pad_sixth_west
      ids:
        east: pad_sixth_east
        north: pad_sixth_north
        south: pad_sixth_south
      about:
        point: datums.anchor
        axis: +z

  - use: assembly.rotate_quadrants
    with:
      source: corner_diagonal_nw
      ids:
        east: corner_diagonal_ne
        south: corner_diagonal_se
        north: corner_diagonal_sw
      about:
        point: datums.anchor
        axis: +z

  - use: assembly.rotate_quadrants
    with:
      source: corner_tie_horizontal
      ids:
        east: corner_tie_horizontal_ne
        south: corner_tie_horizontal_se
        north: corner_tie_horizontal_sw
      about:
        point: datums.anchor
        axis: +z

  - use: assembly.rotate_quadrants
    with:
      source: corner_tie_vertical
      ids:
        east: corner_tie_vertical_ne
        south: corner_tie_vertical_se
        north: corner_tie_vertical_sw
      about:
        point: datums.anchor
        axis: +z

  - use: assembly.linear_bracing
    with:
      id: strap_brace_outer
      path:
        start:
          component: outer_beam_south
          face: +y
        end:
          component: outer_beam_north
          face: -y
      attach:
        face: +z
        plane: datums.planes.deck_surface
      material: hardware
      description: "Flat strap X-brace tying outer beams"

  - id: soil_west
    class: IfcSlab
    profile: rectangle
    size:
      - (dimensions.structure.deck_span - dimensions.structure.pond_span) / 2
      - dimensions.structure.deck_span
    height: dimensions.site.water_depth
    material: soil
    label: "Soil fill"
    label_id: "SO"
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-x, -y, +y]
      - touch_planes:
          object: datums.planes.water_surface
          faces: [+z]
    metadata:
      views: [section]

  - id: soil_east
    class: IfcSlab
    profile: rectangle
    size:
      - (dimensions.structure.deck_span - dimensions.structure.pond_span) / 2
      - dimensions.structure.deck_span
    height: dimensions.site.water_depth
    material: soil
    label: "Soil fill"
    label_id: "SO"
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [+x, -y, +y]
      - touch_planes:
          object: datums.planes.water_surface
          faces: [+z]
    metadata:
      views: [section]

  - id: corner_diagonal_nw
    class: IfcJoist
    profile: rectangle
    size:
      - dimensions.structure.corner_diagonal_length
      - dimensions.structure.joist_width
      - dimensions.structure.joist_depth
    material: joist
    label: "Corner joist to overhang"
    label_id: "C8"
    metadata:
      _rotation_z: 45
      views: [plan]
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-x, +y]
      - touch_planes:
          object: datums.planes.joist_top
          faces: [+z]

  - id: corner_tie_horizontal
    class: IfcJoist
    profile: rectangle
    size:
      - dimensions.structure.corner_tie_spacing
      - dimensions.structure.joist_width
      - dimensions.structure.joist_depth
    material: joist
    label: "Corner tie to diagonal"
    label_id: "C9"
    metadata:
      views: [plan]
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces:
            - subject: -x
              object: -x
            - subject: +y
              object: +y
          inset:
            subject: {}
            object:
              +y: -dimensions.structure.corner_tie_spacing + dimensions.structure.joist_width / 2
      - touch_planes:
          object: datums.planes.joist_top
          faces: [+z]

  - id: corner_tie_vertical
    class: IfcJoist
    profile: rectangle
    size:
      - dimensions.structure.joist_width
      - dimensions.structure.corner_tie_spacing
      - dimensions.structure.joist_depth
    material: joist
    label: "Corner tie to diagonal"
    label_id: "C9"
    metadata:
      views: [plan]
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces:
            - subject: -x
              object: -x
            - subject: +y
              object: +y
          inset:
            subject: {}
            object:
              -x: -dimensions.structure.corner_tie_spacing + dimensions.structure.joist_width / 2
      - touch_planes:
          object: datums.planes.joist_top
          faces: [+z]

views:
  plan:
    title: "Plan — Option C relationship-first schema example"
    scale_hint: 0.18
    renders:
      - svg
      - png
  section:
    title: "Section — Option C relationship-first schema example"
    plane:
      axis: y
      coordinate: dimensions.structure.pond_span / 2
