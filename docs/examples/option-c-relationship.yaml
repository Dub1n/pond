schema: pond-relationship-ergonomics-alpha
info:
  option: C
  title: "Option C — Phase 4 relationship-first schema sketch"
  description: >
    Illustrative Phase 4 rewrite of Option C using IFC-aligned axes, relationship
    constraints, datum bundles, face batching, rotation helpers, and inline assemblies.
    Bundles and placements are centered around the origin to simplify rotation-based
    assemblies.

dimensions:
  structure:
    deck_span: 5000
    pond_span: 3000
    backspan: 1000
    cantilever: 250
    walkway_gap: 0
    joist_spacing: 400
    joist_width: 47
    joist_depth: 150
    beam_width: 47
    beam_height: 150
    deck_clearance: 100
    joist_elevation: 0
    corner_diagonal_length: 1768
    corner_tie_spacing: 500
  finishes:
    deck_thickness: 28
  site:
    water_depth: 900
    pad_size: 300
    pad_height: 100

datums:
  anchor:
    type: point
    coordinates:
      +x: 0
      +y: 0
      +z: 0
  bundles:
    deck_faces:
      type: faces
      origin:
        ref: datums.anchor
      translate:
        +x: -dimensions.structure.deck_span / 2
        +y: -dimensions.structure.deck_span / 2
      span:
        +x: dimensions.structure.deck_span
        +y: dimensions.structure.deck_span
    pond_faces:
      type: faces
      origin:
        ref: datums.anchor
      translate:
        +x: -dimensions.structure.pond_span / 2
        +y: -dimensions.structure.pond_span / 2
      span:
        +x: dimensions.structure.pond_span
        +y: dimensions.structure.pond_span
  pad_first_y:
    type: point
    coordinates:
      +y: (dimensions.structure.pond_span - 2 * dimensions.structure.cantilever) / 2
      +x: (dimensions.structure.pond_span - 2 * dimensions.structure.cantilever) / 2
  pad_sixth_y:
    type: point
    coordinates:
      +y: (dimensions.structure.pond_span - 2 * dimensions.structure.cantilever) / 2 - 5 * ((dimensions.structure.pond_span - 2 * dimensions.structure.cantilever) / 6)
      +x: (dimensions.structure.pond_span - 2 * dimensions.structure.cantilever) / 2 - 5 * ((dimensions.structure.pond_span - 2 * dimensions.structure.cantilever) / 6)
  planes:
    joist_top:
      base:
        ref: datums.anchor
      normal: +z
      offset: dimensions.structure.joist_elevation
    deck_surface:
      base:
        ref: datums.planes.joist_top
      normal: +z
      offset: dimensions.finishes.deck_thickness
    water_surface:
      base:
        ref: datums.planes.joist_top
      normal: +z
      offset: -dimensions.structure.deck_clearance
    water_bottom:
      base:
        ref: datums.planes.water_surface
      normal: +z
      offset: -dimensions.site.water_depth
    pad_top:
      base:
        ref: datums.planes.joist_top
      normal: +z
      offset: -dimensions.structure.joist_depth

components:
  - id: pond_water
    class: IfcBuildingElementProxy
    profile: rectangle
    size: [dimensions.structure.pond_span, dimensions.structure.pond_span, dimensions.site.water_depth]
    material: water
    label: "Pond water"
    label_id: "C2"
    ifc:
      predefined_type: ELEMENT
    relate:
      - flush_bundle:
          bundle: datums.bundles.pond_faces
          faces: [+x, -x, +y, -y]
      - contact:
          subject:
            component: pond_water
            pos: +z
          object:
            datum: datums.planes.water_surface
            pos: +z
      - contact:
          subject:
            component: pond_water
            pos: -z
          object:
            datum: datums.planes.water_bottom
            pos: +z

  - id: pond_opening
    class: IfcOpeningElement
    profile: rectangle
    size:
      - dimensions.structure.pond_span - 2 * dimensions.structure.cantilever
      - dimensions.structure.pond_span - 2 * dimensions.structure.cantilever
      - dimensions.finishes.deck_thickness
    ifc:
      predefined_type: OPENING
    relate:
      - flush_bundle:
          bundle: datums.bundles.pond_faces
          faces: [+x, -x, +y, -y]
          inset:
            subject: {}
            object:
              +x: -dimensions.structure.cantilever
              -x: -dimensions.structure.cantilever
              +y: -dimensions.structure.cantilever
              -y: -dimensions.structure.cantilever
      - contact:
          subject:
            component: pond_opening
            pos: -z
          object:
            datum: datums.planes.joist_top
            pos: +z
      - contact:
          subject:
            component: pond_opening
            pos: +z
          object:
            datum: datums.planes.deck_surface
            pos: +z
    metadata:
      views: [section]

  - id: deck_surface
    class: IfcSlab
    profile: rectangle
    size: [dimensions.structure.deck_span, dimensions.structure.deck_span, dimensions.finishes.deck_thickness]
    material: decking
    label: "Deck surface (1.0 m backspan + 0.25 m overhang)"
    label_id: "C1"
    ifc:
      predefined_type: FLOOR
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [+x, -x, +y, -y]
      - contact:
          subject:
            component: deck_surface
            pos: -z
          object:
            datum: datums.planes.joist_top
            pos: +z
      - contact:
          subject:
            component: deck_surface
            pos: +z
          object:
            datum: datums.planes.deck_surface
            pos: +z
    voids:
      - ref: pond_opening

  - id: outer_beam_west
    class: IfcBeam
    profile: rectangle
    size: [dimensions.structure.beam_width, dimensions.structure.deck_span, dimensions.structure.beam_height]
    material: timber
    label: "Support beam at outer rim"
    label_id: "C4"
    ifc:
      predefined_type: BEAM
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-x, -y, +y]
      - contact:
          subject:
            component: outer_beam_west
            pos: -z
          object:
            datum: datums.planes.pad_top
            pos: +z

  - use: assembly.rotate_quadrants
    with:
      source: outer_beam_west
      ids:
        east: outer_beam_east
        north: outer_beam_north
        south: outer_beam_south
      about:
        point: datums.anchor
        axis: +z

  - id: inner_beam_west
    class: IfcBeam
    profile: rectangle
    size: [dimensions.structure.beam_width, dimensions.structure.deck_span, dimensions.structure.beam_height]
    material: timber
    label: "Inner beam (saddle hanger rebate)"
    label_id: "C4B"
    ifc:
      predefined_type: BEAM
    relate:
      - flush_bundle:
          bundle: datums.bundles.pond_faces
          faces:
            - subject: +x
              object: -x
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-y, +y]
      - contact:
          subject:
            component: inner_beam_west
            pos: -z
          object:
            datum: datums.planes.pad_top
            pos: +z

  - use: assembly.rotate_quadrants
    with:
      source: inner_beam_west
      ids:
        east: inner_beam_east
        north: inner_beam_north
        south: inner_beam_south
      about:
        point: datums.anchor
        axis: +z

  - id: joist_run_west
    class: IfcBeam
    profile: rectangle
    size:
      - dimensions.structure.backspan + dimensions.structure.cantilever - dimensions.structure.beam_width
      - dimensions.structure.joist_width
      - dimensions.structure.joist_depth
    material: timber
    label: "47×150 mm joist (1.0 m backspan + 0.25 m cantilever)"
    label_id: "C5"
    ifc:
      predefined_type: JOIST
    relate:
      - contact:
          subject:
            component: joist_run_west
            pos: -x
          object:
            component: outer_beam_west
            pos: +x
      - contact:
          subject:
            component: joist_run_west
            pos: +z
          object:
            datum: datums.planes.joist_top
            pos: +z
      - run_between:
          start_pos: +y
          end_pos: -y
          from:
            ref: datums.bundles.pond_faces
            pos: +y
          to:
            ref: datums.bundles.pond_faces
            pos: -y
          count: 7
          orient: along_run
          include_seed: true
          inset:
            start: dimensions.structure.cantilever + dimensions.structure.joist_width / 2
            end: dimensions.structure.cantilever + dimensions.structure.joist_width / 2

  - use: assembly.rotate_quadrants
    with:
      source: joist_run_west
      ids:
        east: joist_run_east
        north: joist_run_north
        south: joist_run_south
      about:
        point: datums.anchor
        axis: +z

  - id: pad_belt_west
    class: IfcFooting
    profile: rectangle
    size: [dimensions.site.pad_size, dimensions.site.pad_size, dimensions.site.pad_height]
    material: pad
    label: "Shallow pad foundation"
    label_id: "C6"
    ifc:
      predefined_type: PAD_FOOTING
    relate:
      - contact:
          subject:
            component: pad_belt_west
            pos: +z
          object:
            datum: datums.planes.pad_top
            pos: +z
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-x]
          inset:
            subject:
              -x: -dimensions.structure.beam_width / 2
    repeat:
      axis: +y
      span:
        use: datums.bundles.deck_faces.y
        inset:
          start: dimensions.site.pad_size / 2
          end: dimensions.site.pad_size / 2
      count: 3
      include_seed: true

  - use: assembly.rotate_quadrants
    with:
      source: pad_belt_west
      ids:
        east: pad_belt_east
        north: pad_belt_north
        south: pad_belt_south
      about:
        point: datums.anchor
        axis: +z

  - id: soil_west
    class: IfcSlab
    profile: rectangle
    size:
      - (dimensions.structure.deck_span - dimensions.structure.pond_span) / 2
      - dimensions.structure.deck_span
      - 0
    material: soil
    label: "Soil fill"
    label_id: "SO"
    ifc:
      predefined_type: FLOOR
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [-x, -y, +y]
      - contact:
          subject:
            component: soil_west
            pos: +z
          object:
            datum: datums.planes.water_surface
            pos: +z
    metadata:
      views: [section]

  - id: soil_east
    class: IfcSlab
    profile: rectangle
    size:
      - (dimensions.structure.deck_span - dimensions.structure.pond_span) / 2
      - dimensions.structure.deck_span
      - 0
    material: soil
    label: "Soil fill"
    label_id: "SO"
    ifc:
      predefined_type: FLOOR
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces: [+x, -y, +y]
      - contact:
          subject:
            component: soil_east
            pos: +z
          object:
            datum: datums.planes.water_surface
            pos: +z
    metadata:
      views: [section]

  - id: corner_diagonal_nw
    class: IfcBeam
    profile: rectangle
    size: [dimensions.structure.corner_diagonal_length, dimensions.structure.joist_width, dimensions.structure.joist_depth]
    material: joist
    label: "Corner joist to overhang"
    label_id: "C8"
    metadata:
      _rotation_z: 45
      views: [plan]
    ifc:
      predefined_type: JOIST
    relate:
      - align:
          subject:
            component: corner_diagonal_nw
            pos: -x+y
          object:
            bundle: datums.bundles.deck_faces
            pos: -x+y
      - contact:
          subject:
            component: corner_diagonal_nw
            pos: +z
          object:
            datum: datums.planes.joist_top
            pos: +z

  - id: corner_tie_horizontal
    class: IfcBeam
    profile: rectangle
    size: [dimensions.structure.corner_tie_spacing, dimensions.structure.joist_width, dimensions.structure.joist_depth]
    material: joist
    label: "Corner tie to diagonal"
    label_id: "C9"
    metadata:
      views: [plan]
    ifc:
      predefined_type: JOIST
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces:
            - subject: -x
              object: -x
            - subject: +y
              object: +y
          inset:
            subject: {}
            object:
              +y: -dimensions.structure.corner_tie_spacing + dimensions.structure.joist_width / 2
      - contact:
          subject:
            component: corner_tie_horizontal
            pos: +z
          object:
            datum: datums.planes.joist_top
            pos: +z

  - id: corner_tie_vertical
    class: IfcBeam
    profile: rectangle
    size: [dimensions.structure.joist_width, dimensions.structure.corner_tie_spacing, dimensions.structure.joist_depth]
    material: joist
    label: "Corner tie to diagonal"
    label_id: "C9"
    metadata:
      views: [plan]
    ifc:
      predefined_type: JOIST
    relate:
      - flush_bundle:
          bundle: datums.bundles.deck_faces
          faces:
            - subject: -x
              object: -x
            - subject: +y
              object: +y
          inset:
            subject: {}
            object:
              -x: -dimensions.structure.corner_tie_spacing + dimensions.structure.joist_width / 2
      - contact:
          subject:
            component: corner_tie_vertical
            pos: +z
          object:
            datum: datums.planes.joist_top
            pos: +z

  - use: assembly.rotate_quadrants
    with:
      source: corner_diagonal_nw
      ids:
        east: corner_diagonal_ne
        south: corner_diagonal_se
        north: corner_diagonal_sw
      about:
        point: datums.anchor
        axis: +z

  - use: assembly.rotate_quadrants
    with:
      source: corner_tie_horizontal
      ids:
        east: corner_tie_horizontal_ne
        south: corner_tie_horizontal_se
        north: corner_tie_horizontal_sw
      about:
        point: datums.anchor
        axis: +z

  - use: assembly.rotate_quadrants
    with:
      source: corner_tie_vertical
      ids:
        east: corner_tie_vertical_ne
        south: corner_tie_vertical_se
        north: corner_tie_vertical_sw
      about:
        point: datums.anchor
        axis: +z

views:
  plan:
    title: "Plan — Option C relationship-first schema example"
    scale_hint: 0.18
    renders:
      - svg
      - png
  section:
    title: "Section — Option C relationship-first schema example"
    plane:
      axis: y
      coordinate: dimensions.structure.pond_span / 2
